<style>
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Strip Text', -apple-system, system-ui, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(20px, 5vw, 56px);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .brand img { height: 52px; width: auto; }

  main.fy { max-width: 1320px; margin: 0 auto; padding: 26px clamp(20px, 5vw, 56px) 72px; }
  .fy-eyebrow {
    font-weight: 700; font-size: 0.72rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  .fy h1 {
    font-family: 'Panel Display', 'Strip Text', sans-serif; font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.01em;
    font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0 0 10px;
  }
  .fy-sub { color: var(--ink-muted); font-size: 0.92rem; max-width: 62ch; margin: 0 0 26px; }

  /* ── Signed-out / empty / error states ── */
  .fy-state {
    max-width: 480px; margin: 40px auto; text-align: center;
    padding: 34px 26px; border-radius: var(--r-md); background: var(--bg-panel); border: 1px solid var(--line);
  }
  .fy-state svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 14px; }
  .fy-state h2 { font-size: 1.1rem; font-weight: 800; margin: 0 0 8px; }
  .fy-state p { font-size: 0.88rem; color: var(--ink-muted); margin: 0 0 18px; line-height: 1.55; }
  .fy-state .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .fy-state a.btn-primary-sm, .fy-state a.btn-ghost-sm {
    text-decoration: none; display: inline-flex; align-items: center; padding: 10px 20px;
  }

  /* ── Taste summary ── */
  .fy-taste {
    margin: 0 0 34px; padding: 18px 20px; border-radius: var(--r-md);
    background: var(--bg-panel); border: 1px solid var(--line);
  }
  .fy-taste-head { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
  .fy-taste-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .fy-taste-row + .fy-taste-row { border-top: 1px solid var(--line); }
  .fy-taste-genre { flex: 0 0 128px; font-size: 0.85rem; font-weight: 700; }
  .fy-taste-bar { flex: 1; height: 7px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
  .fy-taste-bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .fy-taste-note { font-size: 0.78rem; color: var(--ink-faint); margin-top: 14px; }

  /* ── Genre shelves ── */
  .fy-shelf { margin-bottom: 40px; }
  .fy-shelf-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .fy-shelf-title {
    font-family: 'Panel Display', 'Strip Text', sans-serif; font-weight: 900;
    text-transform: uppercase; font-size: 1.15rem; margin: 0;
  }
  .fy-shelf-why { font-size: 0.78rem; color: var(--ink-faint); }

  footer.footer-main { border-top: 1px solid var(--line); padding: 30px clamp(20px, 5vw, 56px); text-align: center; font-size: 0.82rem; color: var(--ink-faint); }
  footer.footer-main a { color: var(--ink-muted); text-decoration: none; }
  footer.footer-main a:hover { color: var(--accent); }
</style>

<script>
window.navigate = function (path) { location.href = '/catalog/#' + path; };

document.addEventListener('DOMContentLoaded', function () {
  initNavDrawer('menuBtn');
  wirePosterSaveButtons();

  var body = document.getElementById('fyBody');
  var SHELF_COUNT = 3;    // top genres to build a shelf for
  var SHELF_SIZE = 10;    // titles per shelf, matching the app's own shelf size

  function signInState() {
    body.innerHTML =
      '<div class="fy-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>' +
        '<h2>Sign in to see your picks</h2>' +
        '<p>For You reads the same taste signal the app builds as you read, save, and swipe. There is nothing to show a guest, because there is nothing to base it on.</p>' +
        '<div class="btn-row"><a class="btn-primary-sm" href="/#signin">Sign in</a><a class="btn-ghost-sm" href="/catalog/">Browse the catalog instead</a></div>' +
      '</div>';
  }

  function noSignalState() {
    body.innerHTML =
      '<div class="fy-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>' +
        '<h2>Nothing to go on yet</h2>' +
        '<p>Save a few titles or spend some time reading in the app, and this page fills in with genres you actually gravitate toward. No fabricated picks in the meantime.</p>' +
        '<div class="btn-row"><a class="btn-primary-sm" href="/discover/?c=trending">See what is trending</a></div>' +
      '</div>';
  }

  function errorState() {
    body.innerHTML = '<p class="statemsg" style="text-align:center;color:var(--ink-faint);padding:40px 0;">Could not load your picks right now. Try again in a moment.</p>';
  }

  // Same resolution order as the app's ForYouScreen: per-user weights first,
  // the legacy profiles column if that table has nothing yet. Positive
  // weights only — the app's swipe-dismiss RPC pushes a genre negative, and a
  // "for you" page recommending what someone just swiped away would be a
  // stranger kind of wrong than showing nothing.
  function resolveGenreWeights(uid) {
    return sb.from('user_genre_preferences').select('genre,weight').eq('user_id', uid)
      .order('weight', { ascending: false })
      .then(function (res) {
        var rows = (res && res.data) || [];
        if (rows.length) return rows;
        return sb.from('profiles').select('genre_weights').eq('id', uid).maybeSingle().then(function (pr) {
          var w = pr && pr.data && pr.data.genre_weights;
          if (!w) return [];
          return Object.keys(w).map(function (g) { return { genre: g, weight: w[g] }; })
            .sort(function (a, b) { return b.weight - a.weight; });
        });
      });
  }

  function fetchShelf(genre) {
    return sb.from('manga_pool')
      .select('id,title,description,genres,rating,chapters,likes,status,lang,cover_url')
      .contains('genres', [genre])
      .eq('nsfw', false)
      .order('likes', { ascending: false, nullsFirst: false })
      .limit(SHELF_SIZE)
      .then(function (res) { return (res && res.data) || []; })
      .catch(function () { return []; });
  }

  // skeletonGrid() brings its own .grid wrapper; each shelf below is already
  // one, so this builds bare poster tiles the same way /discover/ does.
  function skeletonTiles(n) {
    var sk = '';
    for (var i = 0; i < n; i++) sk += '<div class="poster"><div class="poster-img-wrap skeleton"></div></div>';
    return sk;
  }

  function tasteHtml(ranked) {
    var max = ranked[0].weight;
    return '<div class="fy-taste">' +
      '<div class="fy-taste-head">Your taste, so far</div>' +
      ranked.slice(0, 8).map(function (r) {
        var pct = max > 0 ? Math.max(6, Math.round((Math.max(r.weight, 0) / max) * 100)) : 0;
        return '<div class="fy-taste-row">' +
          '<span class="fy-taste-genre">' + esc(r.genre) + '</span>' +
          '<span class="fy-taste-bar"><i style="width:' + pct + '%;"></i></span>' +
        '</div>';
      }).join('') +
      '<p class="fy-taste-note">Built from what you save, finish, and swipe past, here and in the app.</p>' +
    '</div>';
  }

  function loadForYou() {
    var user = getCurrentUser();
    if (!user) { signInState(); return; }

    resolveGenreWeights(user.id).then(function (ranked) {
      var positive = ranked.filter(function (r) { return r.weight > 0; });
      if (!positive.length) { noSignalState(); return; }

      var top = positive.slice(0, SHELF_COUNT);
      body.innerHTML = tasteHtml(positive) + top.map(function (r) {
        return '<div class="fy-shelf" data-genre="' + esc(r.genre) + '">' +
          '<div class="fy-shelf-head">' +
            '<h2 class="fy-shelf-title">Because you like ' + esc(r.genre) + '</h2>' +
            '<span class="fy-shelf-why">Top-rated ' + esc(r.genre).toLowerCase() + ' picks from the catalog</span>' +
          '</div>' +
          '<div class="grid">' + skeletonTiles(SHELF_SIZE) + '</div>' +
        '</div>';
      }).join('');

      top.forEach(function (r) {
        var el = body.querySelector('.fy-shelf[data-genre="' + r.genre.replace(/"/g, '\\"') + '"] .grid');
        fetchShelf(r.genre).then(function (rows) {
          if (!el) return;
          if (!rows.length) { el.closest('.fy-shelf').remove(); return; }
          el.innerHTML = rows.map(function (row) { return posterCard(poolRowToMedia(row)); }).join('');
        });
      });
    }).catch(errorState);
  }

  if (typeof onAuthChange === 'function') {
    onAuthChange(loadForYou);
  } else {
    signInState();
  }
});
</script>
