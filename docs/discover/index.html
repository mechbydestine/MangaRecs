  .disc-sub { color: var(--ink-muted); font-size: 0.92rem; max-width: 62ch; margin: 0 0 22px; }

  /* Switching between the two rails is the whole point of landing here from
     a "See more", so the other one stays one click away rather than a
     trip back to the homepage. */
  .disc-switch { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .disc-switch a {

    border: 1px solid var(--line); border-radius: var(--r-pill);

  .disc-switch a:hover { color: var(--accent); border-color: var(--accent); }
  .disc-switch a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .disc-note { color: var(--ink-faint); font-size: 0.8rem; margin: 0 0 18px; }
  .disc-empty { grid-column: 1/-1; text-align: center; color: var(--ink-faint); padding: 40px 0; }
  .disc-more { text-align: center; margin-top: 30px; }
  .disc-more button {
    font: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer;
    color: var(--ink); background: var(--bg-panel);
    border: 1px solid var(--line-strong); border-radius: var(--r-pill);

  .disc-more button:hover { color: var(--accent); border-color: var(--accent); }
  .disc-more button:disabled { opacity: 0.55; cursor: default; }
  .disc-end { color: var(--ink-faint); font-size: 0.82rem; }

  footer.footer-main a { color: var(--ink-muted); text-decoration: none; }
  footer.footer-main a:hover { color: var(--accent); }

<script>
// posterCard() markup calls navigate() on click; off the catalog SPA that
// means handing the route to it.
window.navigate = function (path) { location.href = '/catalog/#' + path; };

document.addEventListener('DOMContentLoaded', function () {
  initNavDrawer('menuBtn');
  wirePosterSaveButtons();

  var PER_LOAD = 24;

  var GROWING_FIELDS = 'id title { romaji english native } coverImage { extraLarge large } '
    + 'genres format status chapters volumes averageScore popularity startDate { year } countryOfOrigin '
    + 'description(asHtml: false)';

  function pageQuery(filters, page) {
    return {
      gql: 'query($page: Int) { Page(page: $page, perPage: 24) { pageInfo { hasNextPage } media('
        + filters + ') { ' + GROWING_FIELDS + ' } } }',
      vars: { page: page },
    };
  }

  function fetchOrigin(filters, page) {
    var q = pageQuery(filters, page);
    return alFetch(q.gql, q.vars)
      .then(function (d) { return (d && d.Page) || { media: [], pageInfo: {} }; })
      .catch(function () { return null; });
  }

  // Emit `pattern` in a repeating cycle across the origin buckets, so one
  // country can't take the page. Trending runs 4 manhwa/manhua per 1 manga:
  // an unfiltered MANGA trending query comes back overwhelmingly Japanese
  // shonen, which is not what this site is for.
  //
  // Stops the moment a slot can't be filled rather than draining whatever is
  // left, because draining is what breaks the ratio: with 24 rows per origin,
  // running to exhaustion ends up 1:1:1, which is the exact opposite of the
  // point. An origin that returned nothing at all drops out of the cycle
  // first, so one failed query degrades the mix instead of emptying the page.
  function interleave(buckets, pattern, seen, limit) {
    var live = pattern.filter(function (b) { return buckets[b] && buckets[b].length; });
    if (!live.length) return [];
    var idx = buckets.map(function () { return 0; });
    var out = [];
    for (;;) {
      for (var p = 0; p < live.length; p++) {
        var b = live[p];
        var picked = null;
        while (idx[b] < buckets[b].length) {
          var m = buckets[b][idx[b]++];
          if (!m || seen[m.id]) continue;
          picked = m;
          break;
        }
        if (!picked) return out;
        seen[picked.id] = true;
        out.push(picked);
        if (out.length >= limit) return out;
      }
    }
  }

  var BASE = 'type: MANGA, isAdult: false';

  var VIEWS = {
    trending: {
      label: 'Trending Right Now',
      eyebrow: 'Live from the catalog',
      title: 'Trending Right Now',
      sub: 'What readers are piling into this week, pulled live and mixed across manhwa, manhua and manga so one region does not swallow the page.',
      note: '',
      fallbackKey: 'trending',
      // 4 : 1. Order inside the cycle keeps KR and CN alternating.
      pattern: [0, 1, 0, 1, 0, 1, 0, 1, 2, 2],
      origins: ['KR', 'CN', 'JP'],
      filters: function (country, genre) {
        var f = BASE + ', sort: TRENDING_DESC, countryOfOrigin: "' + country + '"';
        if (genre) f += ', genre_in: ["' + genre + '"]';
        return f;
      },
    },
    growing: {
      label: 'Newly Growing',
      eyebrow: 'Small but climbing',
      title: 'Newly Growing',
      sub: 'Series still under a hundred chapters that are already rated well and picking up readers fast. Deeper pages get rarer, which is the point.',
      note: 'Sorted by how fast interest is climbing rather than all-time popularity, so these skew newer and less known the further you scroll.',
      fallbackKey: 'growing',
      pattern: [0, 1],
      origins: ['KR', 'CN'],
      filters: function (country, genre) {
        var f = BASE + ', status: RELEASING, sort: TRENDING_DESC, countryOfOrigin: "' + country + '"'
          + ', chapters_lesser: 100, averageScore_greater: 70';
        if (genre) f += ', genre_in: ["' + genre + '"]';
        return f;
      },
    },
  };

  function currentKey() {
    var m = /[?&]c=([a-z]+)/.exec(location.search);
    var k = m ? m[1] : 'trending';
    return VIEWS[k] ? k : 'trending';
  }

  var key = currentKey();
  var view = VIEWS[key];
  var gridEl = document.getElementById('discGrid');
  var moreEl = document.getElementById('discMore');
  var genre = null;
  var page = 0;
  var seen = {};
  var exhausted = false;
  var loading = false;

  document.getElementById('discEyebrow').textContent = view.eyebrow;
  document.getElementById('discTitle').textContent = view.title;
  document.getElementById('discSub').textContent = view.sub;
  document.title = view.title + ' - MangaRecs';
  if (view.note) {
    var note = document.createElement('p');
    note.className = 'disc-note';
    note.textContent = view.note;
    document.getElementById('discSwitch').insertAdjacentElement('afterend', note);
  }

  document.getElementById('discSwitch').innerHTML = Object.keys(VIEWS).map(function (k) {
    return '<a href="/discover/?c=' + k + '"' + (k === key ? ' aria-current="page"' : '') + '>'
      + esc(VIEWS[k].label) + '</a>';
  }).join('');

  function setMore(html) { moreEl.innerHTML = html; }

  function appendCards(media) {
    var frag = document.createElement('div');
    frag.innerHTML = media.map(posterCard).join('');
    while (frag.firstChild) gridEl.appendChild(frag.firstChild);
  }

  function loadMore() {
    if (loading || exhausted) return;
    loading = true;
    page++;
    var first = page === 1;
    if (first) {
      // skeletonGrid() brings its own .grid wrapper; this page already is one.
      var sk = '';
      for (var s = 0; s < PER_LOAD; s++) sk += '<div class="poster"><div class="poster-img-wrap skeleton"></div></div>';
      gridEl.innerHTML = sk;
    }
    setMore('<button type="button" disabled>Loading…</button>');

    Promise.all(view.origins.map(function (c) {
      return fetchOrigin(view.filters(c, genre), page);
    })).then(function (pages) {
      if (pages.every(function (p) { return p === null; })) throw new Error('all origins failed');
      var buckets = pages.map(function (p) {
        return ((p && p.media) || []).filter(function (m) { return m && m.coverImage; });
      });
      var media = interleave(buckets, view.pattern, seen, PER_LOAD);
      var hasNext = pages.some(function (p) { return p && p.pageInfo && p.pageInfo.hasNextPage; });

      // An empty first page and a dead API are the same thing from the
      // reader's side: a screen with nothing on it. Both route to the
      // stand-ins rather than only the thrown case, which is how this page
      // managed to print "Nothing to show" while 24 usable titles sat in
      // fallback-titles.json.
      if (!media.length && first) throw new Error('first page empty');

      if (first) gridEl.innerHTML = '';
      appendCards(media);
      exhausted = !hasNext;
      // AniList's own paging is the only honest end signal; a page that
      // dedupes down to nothing still has more behind it.
      setMore(exhausted
        ? '<p class="disc-end">That is everything AniList has for this one.</p>'
        : '<button type="button" id="discMoreBtn">Load more</button>');
      loading = false;
    }).catch(function () {
      exhausted = true;
      loading = false;
      setMore('');
      if (!first) return;
      // A genre with genuinely no matches and a dead API look identical from
      // here, so a filtered miss says so plainly instead of standing in with
      // picks that ignore the filter the reader just set.
      if (genre) {
        gridEl.innerHTML = '<p class="disc-empty">Nothing matches that genre right now. Try another.</p>';
        return;
      }
      gridEl.innerHTML = '';
      renderFallbackRail(gridEl, view.fallbackKey).then(function (drew) {
        if (drew) return;
        gridEl.innerHTML = '<p class="disc-empty">Nothing to show here right now. Try again in a moment.</p>';
      });
    });
  }

  moreEl.addEventListener('click', function (e) {
    if (e.target.closest('#discMoreBtn')) loadMore();
  });

  // ── Genre pills ────────────────────────────────────────────────────
  (function initGenreBar() {
    var toggle = document.getElementById('genreToggle');
    var scroll = document.getElementById('genrePills');
    var track = document.getElementById('genreTrack');
    var OPTIONS = ['All genres'].concat(GENRES);
    track.innerHTML = OPTIONS.map(function (g) {
      return '<button class="format-pill' + (g === 'All genres' ? ' active' : '')
        + '" data-genre="' + esc(g) + '" type="button">' + esc(g) + '</button>';
    }).join('');

    toggle.addEventListener('click', function () {
      var open = scroll.hasAttribute('hidden');
      if (open) scroll.removeAttribute('hidden'); else scroll.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    scroll.querySelector('.genre-arrow-prev').addEventListener('click', function () {
      track.scrollBy({ left: -180, behavior: 'smooth' });
    });
    scroll.querySelector('.genre-arrow-next').addEventListener('click', function () {
      track.scrollBy({ left: 180, behavior: 'smooth' });
    });
    track.addEventListener('click', function (e) {
      var btn = e.target.closest('.format-pill');
      if (!btn) return;
      var picked = btn.getAttribute('data-genre');
      Array.prototype.forEach.call(track.children, function (b) { b.classList.toggle('active', b === btn); });
      genre = picked === 'All genres' ? null : picked;
      page = 0;
      seen = {};
      exhausted = false;
      loading = false;
      gridEl.innerHTML = '';
      loadMore();
    });
  })();

  loadMore();
});
</script>
