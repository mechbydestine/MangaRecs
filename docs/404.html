<script>
document.addEventListener('DOMContentLoaded', function () {
  initThemeToggle('themeToggle');
  initNavDrawer('menuBtn');

  // Lightweight, no auth.js/Supabase dependency — this page only needs
  // cover + title + a link into the catalog, not save-button state.
  // Skeleton fills the exact same grid shape immediately so swapping in
  // real covers doesn't shift the footer below it (no pop-in CLS).
  var grid = document.getElementById('miniGrid');
  var SKELETON_COUNT = 6;
  grid.innerHTML = new Array(SKELETON_COUNT).fill(0).map(function () {
    return '<div class="mini-card"><div class="mini-card-img mini-skeleton"></div><div class="mini-skeleton" style="height:11px;width:70%;border-radius:4px;margin-top:6px;"></div></div>';
  }).join('');
  trendingMedia(null, 1).then(function (d) {
    var items = (d.Page.media || []).slice(0, SKELETON_COUNT);
    if (!items.length) { document.getElementById('miniTrending').style.display = 'none'; return; }
    grid.innerHTML = items.map(function (m) {
      return '<a class="mini-card" href="/catalog/#/title/' + m.id + '">' +
        '<div class="mini-card-img"><img src="' + m.coverImage.large + '" alt="' + esc(titleOf(m)) + ' cover art" loading="lazy" width="200" height="300" /></div>' +
        '<div class="mini-card-title">' + esc(titleOf(m)) + '</div>' +
      '</a>';
    }).join('');
  }).catch(function () { document.getElementById('miniTrending').style.display = 'none'; });
});
</script>
