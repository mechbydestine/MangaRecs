  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Strip Text', -apple-system, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;

  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .display { font-family: 'Panel Display', sans-serif; font-weight: 900; letter-spacing: -0.01em; text-transform: uppercase; }

  /* ── Top bar ────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);

  .nav-link { color: var(--ink-muted); text-decoration: none; font-weight: 700; font-size: 0.86rem; flex: none; }

  .brand span { font-weight: 800; font-size: 1rem; letter-spacing: -0.01em; }
  .brand b { color: var(--accent); }
  .searchwrap { flex: 1; position: relative; max-width: 480px; }

    width: 100%; background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px 10px 40px; color: var(--ink);
    font-size: 0.88rem; font-family: inherit;
  }
  .searchwrap input:focus { outline: none; border-color: var(--accent); }

  .search-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-width: 480px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden auto; max-height: 420px; z-index: 55;
  }
  .search-dd-item {
    display: flex; gap: 10px; align-items: center; padding: 8px 12px; text-decoration: none;
    color: inherit; border-bottom: 1px solid var(--line);
  }
  .search-dd-item:hover { background: var(--bg-sunken); }

  .search-dd-title { font-size: 0.86rem; font-weight: 700; line-height: 1.25; }
  .search-dd-meta { font-size: 0.74rem; color: var(--ink-faint); margin-top: 2px; }
  .search-dd-all { display: block; text-align: center; padding: 10px; font-size: 0.82rem; font-weight: 700; color: var(--accent); text-decoration: none; }
  .search-dd-all:hover { background: var(--bg-sunken); }
  .navtabs { display: flex; gap: 4px; flex: none; }
  .navtab {
    padding: 8px 13px; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
    color: var(--ink-muted); border: 1px solid transparent;
  }
  .navtab.active { background: var(--accent-wash); color: var(--accent); border-color: var(--line); }
  @media (max-width: 900px) { .navtabs { display: none; } }
  @media (max-width: 480px) { .topbar-inner { gap: 10px; } }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }

  .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }

    padding: 6px 13px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;

  }
  .genre-chip.active { background: var(--accent); color: #fff; border-color: transparent; }

  /* ── My Library: stats, status tabs, progress stepper ────────────────── */
  .lib-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .lib-stat-pill {
    display: flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 12px;

  }
  .lib-stat-pill svg { width: 15px; height: 15px; color: var(--accent); flex: none; }

  }

  /* ── My Profile ────────────────────────────────────────────────────── */
  .profile-hero-card { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-panel); margin: 20px 0 18px; }

  .profile-namewrap { flex: 1; min-width: 200px; padding-top: 32px; }
  .profile-username { font-size: 1.4rem; font-weight: 800; margin: 0 0 4px; }

  .profile-bio-text { font-size: 0.9rem; color: var(--ink-muted); margin: 0; display: inline; }

  .profile-bio-edit-btn { background: none; border: none; color: var(--accent); font-size: 0.78rem; font-weight: 700; margin-left: 8px; cursor: pointer; padding: 0; }
  .profile-bio-edit textarea {
    width: 100%; max-width: 420px; background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--ink); font-size: 0.86rem; font-family: inherit; resize: vertical; min-height: 60px; box-sizing: border-box;

  .profile-bio-actions { display: flex; gap: 8px; margin-top: 8px; }

  .profile-favorites { margin: 0 0 22px; }
  .profile-favorites-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }

  .profile-fave-cover {

  .profile-stats-row { display: flex; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
  .profile-stat-card {
    flex: 1; min-width: 110px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 12px; text-align: center; cursor: pointer; font-family: inherit;
  }
  .profile-stat-card:hover { border-color: var(--stat-c, var(--accent)); }

  .profile-stat-label { font-size: 0.74rem; color: var(--ink-muted); margin-top: 2px; font-weight: 600; }

  .profile-streak-card { width: fit-content; max-width: 100%; margin-bottom: 30px; }

  /* ── Poster grid ───────────────────────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; margin-bottom: 40px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
  @media (max-width: 340px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
  @media (min-width: 1440px) { .grid { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 22px; } }
  .poster { display: flex; flex-direction: column; gap: 8px; }

    background: var(--bg-sunken); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .poster-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .poster-badge {
    position: absolute; top: 7px; left: 7px; font-size: 0.62rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 7px; border-radius: 999px;
    background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(4px);
  }
  .poster-score {
    position: absolute; bottom: 7px; right: 7px; display: flex; align-items: center; gap: 3px;
    font-size: 0.68rem; font-weight: 800; padding: 3px 7px; border-radius: 999px;
    background: rgba(0,0,0,0.6); color: #FFD34D;
  }
  .poster-score svg { width: 10px; height: 10px; }
  .poster-save {
    position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; padding: 0;

  }
  .poster-save svg { width: 13px; height: 13px; }
  .poster-save.active { background: var(--accent); }
  .poster-save.sync-error { background: #E0554F; }
  .poster-save:disabled { opacity: 0.6; cursor: default; }
  .poster-title { font-size: 0.82rem; font-weight: 700; line-height: 1.25; color: var(--ink); }

  .skeleton { background: linear-gradient(100deg, var(--bg-sunken) 30%, var(--line) 50%, var(--bg-sunken) 70%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }

  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  .statemsg { text-align: center; padding: 60px 20px; color: var(--ink-faint); font-size: 0.9rem; }

  /* ── Detail page ───────────────────────────────────────────────────── */
  .detail-hero { display: grid; grid-template-columns: 220px 1fr; gap: 28px; margin-bottom: 30px; }
  @media (max-width: 640px) { .detail-hero { grid-template-columns: 130px 1fr; gap: 18px; } }
  @media (min-width: 1440px) { .detail-hero { grid-template-columns: 280px 1fr; gap: 36px; } }
  .detail-cover { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); aspect-ratio: 2/3; background: var(--bg-sunken); }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
  .detail-titlewrap { display: flex; flex-direction: column; justify-content: flex-end; }
  .detail-badge-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .format-badge { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 999px; background: var(--accent-wash); color: var(--accent); }
  .status-badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--bg-sunken); color: var(--ink-muted); border: 1px solid var(--line); }
  .detail-title { font-size: clamp(1.5rem, 4vw, 2.3rem); font-weight: 800; line-height: 1.08; letter-spacing: -0.01em; }
  .detail-native { font-size: 0.85rem; color: var(--accent-soft); margin-top: 6px; }
  .detail-alt { font-size: 0.78rem; color: var(--ink-faint); margin-top: 4px; }
  .detail-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 0.86rem; padding: 11px 18px; border-radius: 10px; border: none;
  }
  .btn-primary[disabled] { opacity: 0.5; cursor: default; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px; background: var(--bg-panel); color: var(--ink);
    font-weight: 700; font-size: 0.86rem; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line);
  }
  .btn-ghost.active { color: var(--accent); border-color: var(--accent); }
  .btn-ghost svg, .btn-primary svg { width: 17px; height: 17px; flex: none; }
  .readlink-icon { width: 17px; height: 17px; flex: none; object-fit: contain; border-radius: 3px; }

  .detail-body { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .detail-body { grid-template-columns: 1fr; } }
  .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
  .card-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 12px; }
  .synopsis { font-size: 0.92rem; line-height: 1.65; color: var(--ink-muted); }
  .synopsis a { color: var(--accent); }
  .showmore { color: var(--accent); font-weight: 700; font-size: 0.82rem; margin-top: 10px; background: none; border: none; padding: 0; }

  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.84rem; }
  .info-row:first-child { border-top: none; }
  .info-row dt { color: var(--ink-faint); }
  .info-row dd { margin: 0; font-weight: 600; text-align: right; }

  .chiprow { display: flex; flex-wrap: wrap; gap: 7px; }
  .genrechip { font-size: 0.76rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--bg-sunken); border: 1px solid var(--line); }

  .warncard { background: var(--warn-wash); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
  .warncard .card-title { color: var(--warn); }
  .warn-item { font-size: 0.82rem; color: var(--warn); opacity: 0.92; padding: 3px 0; }

  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
  .char-card { text-align: center; }
  .char-img { aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: var(--bg-sunken); border: 1px solid var(--line); position: relative; }
  .char-img img { width: 100%; height: 100%; object-fit: cover; }
  .char-role { position: absolute; top: 5px; left: 5px; font-size: 0.58rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; }
  .char-name { font-size: 0.72rem; font-weight: 600; margin-top: 6px; line-height: 1.25; }

  .backlink { display: inline-flex; align-items: center; gap: 6px; font-size: 0.84rem; font-weight: 700; color: var(--ink-muted); margin-bottom: 18px; }
  .backlink:hover { color: var(--accent); }
  .backlink svg { width: 15px; height: 15px; }

  footer { font-size: 0.8rem; color: var(--ink-faint); }
  footer a { color: var(--ink-muted); font-weight: 600; }
  footer a:hover { color: var(--accent); }

  /* ── Footer (matches index.html) ──────────────────────────────────── */
  .footer-main { border-top: 1px solid var(--line); padding: clamp(36px, 6vw, 56px) clamp(20px, 5vw, 56px) 28px; text-align: left; }
  .footer-grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
  .footer-brand-word { font-family: 'Strip Text', sans-serif; font-weight: 800; font-size: 1.05rem; }
  .footer-brand-word b { color: var(--accent); }
  .footer-tagline { font-size: 0.84rem; color: var(--ink-muted); margin-top: 8px; max-width: 320px; line-height: 1.5; }
  .footer-col-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
  .footer-col a { display: block; font-size: 0.86rem; color: var(--ink-muted); text-decoration: none; padding: 5px 0; font-weight: 600; }
  .footer-col a:hover { color: var(--accent); }
  .footer-social { display: flex; gap: 10px; margin-top: 4px; }
  .footer-social a {
    display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    border-radius: 999px; background: var(--bg-sunken); border: 1px solid var(--line); color: var(--ink-muted);
  }
  .footer-social a:hover { color: var(--accent); border-color: var(--accent); }
  .footer-social svg { width: 15px; height: 15px; }
  .footer-bottom {
    max-width: 1320px; margin: 28px auto 0; padding-top: 20px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    font-size: 0.76rem; color: var(--ink-faint);
  }
  @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; } }
  @media (min-width: 1440px) { .footer-grid, .footer-bottom { max-width: 1480px; } }

  /* ── Nav icon buttons + account panel ─────────────────────────────── */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 999px; flex: none;
    background: var(--bg-panel); border: 1px solid var(--line);
    color: var(--ink-muted); cursor: pointer; padding: 0;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.signed-in { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
  .account-wrap { position: relative; flex: none; }
  .account-panel {
    position: absolute; top: calc(100% + 10px); right: 0; width: 260px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 16px; display: none; z-index: 60;
  }
  .account-panel.open { display: block; }
  .account-tabtitle { font-weight: 800; font-size: 0.95rem; margin-bottom: 10px; }
  .account-panel input {
    width: 100%; background: var(--bg-sunken); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; color: var(--ink); font-size: 0.86rem;
    font-family: inherit; margin-bottom: 8px; box-sizing: border-box;
  }
  .account-panel input:focus { outline: none; border-color: var(--accent); }
  .account-error { color: #E0554F; font-size: 0.78rem; min-height: 1em; margin-bottom: 4px; }
  .account-hint { font-size: 0.78rem; color: var(--ink-muted); margin: -4px 0 10px; line-height: 1.4; }
  .sync-warning {
    margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.8rem;
    background: rgba(224,85,79,0.12); color: #E0554F; border: 1px solid rgba(224,85,79,0.3);
  }

  /* ── My Library ────────────────────────────────────────────────────── */
  .lib-signedout { text-align: center; padding: 60px 20px; }
  .lib-signedout p { color: var(--ink-muted); margin: 10px 0 20px; }
  .lib-card { cursor: default; }
  .lib-remove {
    position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; padding: 0;
    display: flex; align-items: center; justify-content: center; border-radius: 999px;
    background: rgba(0,0,0,0.55); border: none; color: #fff; cursor: pointer; backdrop-filter: blur(4px);
  }
  .lib-remove:hover { background: #E0554F; }
  .lib-remove svg { width: 13px; height: 13px; }
  .lib-remove:disabled { opacity: 0.5; cursor: default; }
  .lib-pill.lib-reading { background: var(--accent); color: #fff; }
  .lib-pill.lib-completed { background: #3FAE73; color: #fff; }
  .lib-pill.lib-bookmarked { background: #D69A2D; color: #fff; }
  .btn-row { margin-top: 2px; }
  .btn-primary-sm, .btn-ghost-sm {
    width: 100%; text-align: center; font-size: 0.86rem; font-weight: 700;
    padding: 9px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  .btn-primary-sm { background: var(--accent); color: #fff; border: none; }
  .btn-primary-sm:disabled { opacity: 0.6; }
  .btn-ghost-sm { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .account-switch {
    display: block; width: 100%; background: none; border: none; color: var(--ink-muted);
    font-size: 0.78rem; text-align: center; padding: 10px 0 2px; cursor: pointer; font-family: inherit;
  }
  .account-switch:hover { color: var(--accent); }
  .account-divider { text-align: center; font-size: 0.72rem; color: var(--ink-faint); margin: 8px 0; }
  .account-email { font-size: 0.86rem; font-weight: 600; margin-bottom: 12px; word-break: break-all; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  initThemeToggle('themeToggle');
  initAccountPanel('accountBtn', 'accountPanel');
  wirePosterSaveButtons();

  var SORT_OPTIONS = [
    { id: 'TRENDING_DESC', label: 'Trending' },
    { id: 'POPULARITY_DESC', label: 'Most Popular' },
    { id: 'SCORE_DESC', label: 'Top Rated' },
  ];
  var currentSort = SORT_OPTIONS[0].id;
  var currentGenre = null;

  var navTabsEl = document.getElementById('navTabs');
  var catRailMobile = document.getElementById('catRailMobile');
  navTabsEl.innerHTML = CATEGORIES.map(function (c) {
    return '<a class="navtab" data-cat="' + c.id + '" href="#/browse/' + c.id + '" onclick="navigate(\'/browse/' + c.id + '\');return false;">' + c.label + '</a>';
  }).join('');
  catRailMobile.innerHTML = CATEGORIES.map(function (c) {
    return '<a class="catchip" data-cat="' + c.id + '" href="#/browse/' + c.id + '" onclick="navigate(\'/browse/' + c.id + '\');return false;">' + c.label + '</a>';
  }).join('');

  function debounce(fn, ms) {
    var t;
    return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); };
  }

  function sortSelectHtml() {
    return '<select id="sortSelect" aria-label="Sort by" style="background:var(--bg-panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);font-size:0.82rem;font-weight:600;font-family:inherit;">' +
      SORT_OPTIONS.map(function (o) { return '<option value="' + o.id + '"' + (o.id === currentSort ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') +
      '</select>';
  }
  function wireSortSelect() {
    var sel = document.getElementById('sortSelect');
    if (sel) sel.addEventListener('change', function () { currentSort = sel.value; router(); });
  }

  function genreChipsHtml() {
    return '<div class="genre-chips" id="genreChips">' +
      '<button type="button" class="genre-chip' + (!currentGenre ? ' active' : '') + '" data-genre="">All genres</button>' +
      GENRES.map(function (g) {
        return '<button type="button" class="genre-chip' + (currentGenre === g ? ' active' : '') + '" data-genre="' + esc(g) + '">' + esc(g) + '</button>';
      }).join('') +
    '</div>';
  }
  function wireGenreChips() {
    var el = document.getElementById('genreChips');
    if (!el) return;
    el.addEventListener('click', function (e) {
      var btn = e.target.closest('.genre-chip');
      if (!btn) return;
      currentGenre = btn.getAttribute('data-genre') || null;
      router();
    });
  }

  // ── Views ─────────────────────────────────────────────────────────────
  var app = document.getElementById('app');

  // Shared "Load more" pager — appends the next page's cards into gridEl
  // instead of replacing it, so browsing isn't hard-capped at one page.
  function wireLoadMore(gridEl, fetchPage, page, hasNext) {
    var old = document.getElementById('loadMoreWrap');
    if (old) old.remove();
    if (!hasNext) return;
    var wrap = document.createElement('div');
    wrap.id = 'loadMoreWrap';
    wrap.style.cssText = 'text-align:center;margin-top:4px;';
    wrap.innerHTML = '<button class="btn-ghost" id="loadMoreBtn" type="button" style="cursor:pointer;">Load more</button>';
    gridEl.insertAdjacentElement('afterend', wrap);
    document.getElementById('loadMoreBtn').addEventListener('click', function () {
      var btn = this;
      btn.textContent = 'Loading…';
      btn.disabled = true;
      fetchPage(page + 1).then(function (d) {
        gridEl.insertAdjacentHTML('beforeend', d.Page.media.map(posterCard).join(''));
        wireLoadMore(gridEl, fetchPage, page + 1, d.Page.pageInfo && d.Page.pageInfo.hasNextPage);
      }).catch(function () { btn.textContent = 'Load more'; btn.disabled = false; });
    });
  }

  function renderHome() {
    setActiveTab('all');
    app.innerHTML = skeletonGrid(12);
    trendingMedia(null, 1, currentSort, currentGenre).then(function (d) {
      app.innerHTML =
        '<div class="section-head"><div style="display:flex;align-items:baseline;gap:10px;"><h1 class="section-title">Trending Now</h1><span class="section-sub">' + d.Page.media.length + ' titles</span></div>' + sortSelectHtml() + '</div>' +
        genreChipsHtml() +
        '<div class="grid" id="mainGrid">' + d.Page.media.map(posterCard).join('') + '</div>';
      wireSortSelect();
      wireGenreChips();
      wireLoadMore(document.getElementById('mainGrid'), function (p) { return trendingMedia(null, p, currentSort, currentGenre); }, 1, d.Page.pageInfo && d.Page.pageInfo.hasNextPage);
    }).catch(function () { app.innerHTML = '<p class="statemsg">Couldn\'t load titles right now. Try again in a moment.</p>'; });
  }

  function renderBrowse(catId) {
    var cat = CATEGORIES.filter(function (c) { return c.id === catId; })[0] || CATEGORIES[0];
    setActiveTab(cat.id);
    app.innerHTML = skeletonGrid(18);
    trendingMedia(cat.id === 'all' ? null : cat, 1, currentSort, currentGenre).then(function (d) {
      app.innerHTML =
        '<div class="section-head"><div style="display:flex;align-items:baseline;gap:10px;"><h1 class="section-title">' + esc(cat.label) + '</h1><span class="section-sub">' + d.Page.media.length + ' titles</span></div>' + sortSelectHtml() + '</div>' +
        genreChipsHtml() +
        '<div class="grid" id="mainGrid">' + d.Page.media.map(posterCard).join('') + '</div>';
      wireSortSelect();
      wireGenreChips();
      wireLoadMore(document.getElementById('mainGrid'), function (p) { return trendingMedia(cat.id === 'all' ? null : cat, p, currentSort, currentGenre); }, 1, d.Page.pageInfo && d.Page.pageInfo.hasNextPage);
    }).catch(function () { app.innerHTML = '<p class="statemsg">Couldn\'t load titles right now. Try again in a moment.</p>'; });
  }

  function renderSearch(q) {
    setActiveTab(null);
    app.innerHTML = skeletonGrid(12);
    searchMedia(q, null, 1).then(function (d) {
      if (!d.Page.media.length) { app.innerHTML = '<p class="statemsg">No results for "' + esc(q) + '"</p>'; return; }
      app.innerHTML =
        '<div class="section-head"><h1 class="section-title">"' + esc(q) + '"</h1><span class="section-sub">' + d.Page.media.length + ' results</span></div>' +
        '<div class="grid" id="mainGrid">' + d.Page.media.map(posterCard).join('') + '</div>';
      wireLoadMore(document.getElementById('mainGrid'), function (p) { return searchMedia(q, null, p); }, 1, d.Page.pageInfo && d.Page.pageInfo.hasNextPage);
    }).catch(function () { app.innerHTML = '<p class="statemsg">Search failed. Try again in a moment.</p>'; });
  }

  function renderDetail(id) {
    setActiveTab(null);
    app.innerHTML = '<div class="skeleton" style="height:320px;border-radius:16px;"></div>';
    mediaById(Number(id)).then(function (m) {
      if (!m) { app.innerHTML = '<p class="statemsg">Title not found.</p>'; return; }
      if (m.isAdult && sessionStorage.getItem('mr_adult_ok') !== '1') {
        app.innerHTML = '<div class="card" style="max-width:480px;margin:60px auto;text-align:center;">' +
          '<div class="card-title">Adult Content</div>' +
          '<p style="color:var(--ink-muted);font-size:0.92rem;">This title is tagged as adult content by AniList. Confirm you\'re 18 or older to view its details.</p>' +
          '<button class="btn-ghost" id="adultOkBtn" type="button" style="margin-top:8px;">I\'m 18 or older — continue</button>' +
        '</div>';
        document.getElementById('adultOkBtn').addEventListener('click', function () {
          sessionStorage.setItem('mr_adult_ok', '1');
          renderDetail(id);
        });
        return;
      }
      window.scrollTo(0, 0);
      var saved = isSavedLocally(m.id);
      var authors = m.staff.edges.filter(function (e) { return /Story|Art|Creator/i.test(e.role); }).map(function (e) { return e.node.name.full; });
      var genresHtml = m.genres.map(function (g) { return '<span class="genrechip">' + esc(g) + '</span>'; }).join('');
      var spoilerTags = m.tags.filter(function (t) { return t.rank >= 60 && !t.isMediaSpoiler; }).slice(0, 8);
      var warnTags = m.tags.filter(function (t) { return /Gore|Violence|Sexual|Rape|Suicide|Abuse/i.test(t.name); });
      var seenReadSites = {};
      var readLinks = m.externalLinks
        .filter(function (l) { return l.site && l.url && l.type === 'STREAMING' && !l.isDisabled; })
        .filter(function (l) { if (seenReadSites[l.site]) return false; seenReadSites[l.site] = true; return true; });
      var descHtml = (m.description || 'No synopsis available.').replace(/<br\s*\/?>/gi, ' ').replace(/\n+/g, ' ');
      var descShort = descHtml.length > 420 ? descHtml.slice(0, 420) + '…' : descHtml;
      var recs = ((m.recommendations && m.recommendations.nodes) || [])
        .map(function (n) { return n.mediaRecommendation; })
        .filter(function (r) { return r && r.type === 'MANGA' && !r.isAdult; })
        .slice(0, 8);

      app.innerHTML =
        '<a class="backlink" href="#/" onclick="history.back();return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>' +
        '<div class="detail-hero">' +
          '<div class="detail-cover"><img src="' + m.coverImage.extraLarge + '" alt="" /></div>' +
          '<div class="detail-titlewrap">' +
            '<div class="detail-badge-row"><span class="format-badge">' + formatLabel(m) + '</span><span class="status-badge">' + statusLabel(m.status) + '</span></div>' +
            '<h1 class="detail-title">' + esc(titleOf(m)) + '</h1>' +
            (m.title.native ? '<div class="detail-native">' + esc(m.title.native) + '</div>' : '') +
            (m.title.romaji !== titleOf(m) ? '<div class="detail-alt">' + esc(m.title.romaji) + '</div>' : '') +
            '<div class="detail-actions">' +
              '<button class="btn-ghost' + (saved ? ' active' : '') + '" id="saveBtn">' +
                '<svg viewBox="0 0 24 24" fill="' + (saved ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
                (saved ? 'Saved' : 'Save to Library') +
              '</button>' +
              '<button class="btn-ghost" id="shareBtn" type="button">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' +
                'Share' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +

                // Google's favicon service resolves each site's actual declared

  // ── My Library (real account data, not the localStorage fallback) ──────
  function libStatusLabel(s) { return { reading: 'Reading', completed: 'Completed', bookmarked: 'Bookmarked' }[s] || s; }

  var LIB_TABS = [
    { id: 'reading', label: 'Reading' },
    { id: 'completed', label: 'Completed' },
    { id: 'bookmarked', label: 'Bookmarked' },
  ];

  function libCard(r) {
    return '<div class="poster lib-card">' +
      '<div class="poster-img-wrap">' +
        '<div class="skeleton lib-card-ph" style="position:absolute;inset:0;"></div>' +
        '<img alt="" loading="lazy" style="opacity:0;transition:opacity .3s;" />' +
        '<span class="poster-badge lib-pill lib-' + r.status + '">' + libStatusLabel(r.status) + '</span>' +
        '<button class="lib-remove" type="button" aria-label="Remove from library" title="Remove from library">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
        '</button>' +
      '</div>' +

      (r.status === 'reading' ?
        '<div class="lib-progress">' +
          '<span class="lib-progress-text">Ch. ' + (r.current_chapter || 1) + (r.total_chapters ? ' of ' + r.total_chapters : '') + '</span>' +
        '</div>' : '') +
    '</div>';
  }

  var LIB_STAT_ICONS = {
    flame: '<path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-3 2 1 3 3 3 6a6 6 0 0 1-12 0c0-4 2-6 4-10z"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/>',
    heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  };
  function libStatsHtml(profile) {
    if (!profile) return '';
    var items = [];
    if (profile.streak_count) items.push({ icon: 'flame', text: profile.streak_count + '-day streak' });
    if (profile.chapters_read) items.push({ icon: 'book', text: Number(profile.chapters_read).toLocaleString() + ' chapters read' });
    if (profile.favorite_genre) items.push({ icon: 'heart', text: 'Favorite: ' + esc(profile.favorite_genre) });
    if (!items.length) return '';
    return '<div class="lib-stats">' + items.map(function (it) {
      return '<div class="lib-stat-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + LIB_STAT_ICONS[it.icon] + '</svg>' + esc(it.text) + '</div>';
    }).join('') + '</div>';
  }

  function renderLibrary() {
    setActiveTab(null);
    navTabsEl.classList.add('lib-hide');
    catRailMobile.classList.add('lib-hide');
    if (!getCurrentUser()) {
      app.innerHTML =
        '<div class="lib-signedout">' +
          '<h1 class="section-title">My Library</h1>' +
          '<p>Sign in to see the titles you\'ve saved, synced with the app.</p>' +
          '<button class="btn-primary-sm" id="libSignInBtn" type="button" style="width:auto;padding:10px 20px;">Sign in</button>' +
        '</div>';

    }
    app.innerHTML = '<h1 class="section-title" style="margin-bottom:16px;">My Library</h1><div class="grid" id="libList">' + skeletonGrid(6) + '</div>';
    Promise.all([
      sb.from('reading_progress').select('series_title,status,current_chapter,total_chapters,updated_at')
        .eq('user_id', getCurrentUser().id).order('updated_at', { ascending: false }),
      sb.from('profiles').select('streak_count,chapters_read,favorite_genre').eq('id', getCurrentUser().id).maybeSingle(),
    ])
      .then(function (results) {
        var res = results[0];
        var statsHtml = libStatsHtml(results[1] && results[1].data);
        if (res.error) { document.getElementById('libList').innerHTML = '<p class="statemsg">Couldn\'t load your library. Try again in a moment.</p>'; return; }
        var allRows = (res.data || []).filter(function (r) { return LIB_TABS.some(function (t) { return t.id === r.status; }); });
        if (!allRows.length) {
          app.innerHTML = '<h1 class="section-title" style="margin-bottom:16px;">My Library</h1>' + statsHtml + '<p class="statemsg">Nothing saved yet — browse the catalog and hit save on a title.</p>';
          return;
        }
        var libTab = 'reading';
        var libSort = 'updated';

        app.innerHTML = '<h1 class="section-title" style="margin-bottom:16px;">My Library</h1>' + statsHtml +
          '<div class="section-head"><div class="lib-tabs" id="libTabs"></div>' +
          '<select id="libSortSelect" aria-label="Sort by" style="background:var(--bg-panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);font-size:0.82rem;font-weight:600;font-family:inherit;">' +
            '<option value="updated">Recently updated</option><option value="alpha">A–Z</option>' +
          '</select></div>' +
          '<div class="grid" id="libList"></div>';

        function paintTabs() {
          document.getElementById('libTabs').innerHTML = LIB_TABS.map(function (t) {
            var count = allRows.filter(function (r) { return r.status === t.id; }).length;
            return '<button type="button" class="lib-tab' + (t.id === libTab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + ' (' + count + ')</button>';
          }).join('');
        }

        function currentRows() {
          var filtered = allRows.filter(function (r) { return r.status === libTab; });
          filtered.sort(libSort === 'alpha'
            ? function (a, b) { return a.series_title.localeCompare(b.series_title); }
            : function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); });
          return filtered;
        }

        function paintGrid() {
          var listEl = document.getElementById('libList');
          var rows = currentRows();
          if (!rows.length) { listEl.innerHTML = '<p class="statemsg">Nothing in ' + libStatusLabel(libTab) + ' yet.</p>'; return; }
          listEl.innerHTML = rows.map(libCard).join('');
          var cards = listEl.children;
          Array.prototype.forEach.call(cards, function (card, i) {
            var row = rows[i];
            var removeBtn = card.querySelector('.lib-remove');
            removeBtn.addEventListener('click', function (e) {
              e.preventDefault();
              if (!confirm('Remove "' + row.series_title + '" from your library?')) return;
              removeBtn.disabled = true;
              sb.from('reading_progress').delete()
                .eq('user_id', getCurrentUser().id).eq('series_title', row.series_title)
                .then(function (res) {
                  if (res.error) { removeBtn.disabled = false; alert('Could not remove — try again.'); return; }
                  var idxAll = allRows.indexOf(row);
                  if (idxAll !== -1) allRows.splice(idxAll, 1);
                  paintTabs();
                  paintGrid();
                }).catch(function () { removeBtn.disabled = false; alert('Could not remove — try again.'); });
            });

            searchMedia(row.series_title, null, 1).then(function (d) {
              var m = d.Page.media && d.Page.media[0];
              var img = card.querySelector('img');
              var ph = card.querySelector('.lib-card-ph');
              if (m && m.coverImage && m.coverImage.large) {
                img.src = m.coverImage.large;
                img.addEventListener('load', function () { img.style.opacity = '1'; if (ph) ph.remove(); });
              } else if (ph) {
                ph.style.animation = 'none';
                ph.textContent = esc(row.series_title).charAt(0);
                ph.style.cssText += 'display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--ink-faint);';
              }
            }).catch(function () {});
          });
        }

        paintTabs();
        paintGrid();
        document.getElementById('libTabs').addEventListener('click', function (e) {
          var btn = e.target.closest('.lib-tab');
          if (!btn) return;
          libTab = btn.getAttribute('data-tab');
          paintTabs();
          paintGrid();
        });
        document.getElementById('libSortSelect').addEventListener('change', function () {
          libSort = this.value;
          paintGrid();
        });
      }).catch(function () { document.getElementById('libList').innerHTML = '<p class="statemsg">Couldn\'t load your library. Try again in a moment.</p>'; });
  }

  // ── My Profile ────────────────────────────────────────────────────────
  var PROFILE_THEMES = {
    default: { ring: '#7B5CFF', gradient: ['#7B5CFF', '#1D9E75'] },
    rose:    { ring: '#D4537E', gradient: ['#D4537E', '#993556'] },
    sky:     { ring: '#378ADD', gradient: ['#378ADD', '#185FA5'] },
    emerald: { ring: '#1D9E75', gradient: ['#1D9E75', '#0F6E56'] },
    amber:   { ring: '#EF9F27', gradient: ['#EF9F27', '#BA7517'] },
    violet:  { ring: '#7F77DD', gradient: ['#7F77DD', '#D4537E'] },
    crimson: { ring: '#FF5C7A', gradient: ['#FF5C7A', '#7A0F2E'] },
  };

  function fmtHrsWeb(h) {
    h = h || 0;
    if (h < 1) return Math.round(h * 60) + 'm';
    return (Math.round(h * 10) / 10) + 'h';
  }

  function profileDateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function profileStreakColor(hours) {
    if (!hours || hours <= 0) return null;
    if (hours < 0.25) return '#2D2872';
    if (hours < 0.75) return '#3D3580';
    if (hours < 1.5) return '#4A40A0';
    return '#7B5CFF';
  }

  function profileStreakGridHtml(dailyLog) {
    var log = dailyLog || {};
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var firstOfLastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    var startSunday = new Date(firstOfLastMonth);
    startSunday.setDate(startSunday.getDate() - startSunday.getDay());
    var allDays = [];
    var cursor = new Date(startSunday);
    while (cursor <= today) { allDays.push(new Date(cursor)); cursor.setDate(cursor.getDate() + 1); }
    while (allDays.length % 7 !== 0) allDays.push(null);
    var weeks = [];
    for (var i = 0; i < allDays.length; i += 7) weeks.push(allDays.slice(i, i + 7));

    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var monthHeaders = weeks.map(function (week) {
      for (var j = 0; j < week.length; j++) { if (week[j] && week[j].getDate() === 1) return MONTHS[week[j].getMonth()]; }
      return null;
    });
    if (!monthHeaders[0]) {
      var first = weeks[0].filter(Boolean)[0];
      monthHeaders[0] = first ? MONTHS[first.getMonth()] : null;
    }

    var colsHtml = weeks.map(function (week, wi) {
      var cellsHtml = week.map(function (day) {
        if (!day) return '<div class="profile-streak-cell" style="background:var(--bg-sunken);opacity:.15;"></div>';
        var future = day > today;
        var hours = future ? 0 : (log[profileDateKey(day)] || 0);
        var color = profileStreakColor(hours);
        var inMonth = day.getMonth() === today.getMonth() && day.getFullYear() === today.getFullYear();
        return '<div class="profile-streak-cell" style="background:' + (color || 'var(--bg-sunken)') + ';opacity:' + (future ? 0.15 : inMonth ? 1 : 0.45) + ';" title="' + profileDateKey(day) + (hours ? ' · ' + fmtHrsWeb(hours) : '') + '"></div>';
      }).join('');
      return '<div class="profile-streak-col"><div class="profile-streak-month">' + (monthHeaders[wi] || '') + '</div>' + cellsHtml + '</div>';
    }).join('');

    return '<div class="profile-streak-grid">' +
      '<div class="profile-streak-daylabels"><div class="profile-streak-month-spacer"></div>' +
        ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (l) { return '<div class="profile-streak-daylabel">' + l + '</div>'; }).join('') +
      '</div>' +
      '<div class="profile-streak-weeks">' + colsHtml + '</div>' +
    '</div>';
  }

  function profileStatCardHtml(key, label, value, color) {
    return '<button class="profile-stat-card" type="button" data-stat="' + key + '" style="--stat-c:' + color + ';">' +
      '<div class="profile-stat-value">' + esc(value) + '</div>' +
      '<div class="profile-stat-label">' + esc(label) + '</div>' +
    '</button>';
  }

  function normalizeFavesWeb(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.map(function (f) {
      if (typeof f === 'string') return { title: f };
      if (f && !f.title && (f.seriesTitle || f.series_title || f.name)) {
        var copy = {};
        for (var k in f) { if (f.hasOwnProperty(k)) copy[k] = f[k]; }
        copy.title = f.seriesTitle || f.series_title || f.name;
        return copy;
      }
      return f;
    }).filter(function (f) { return f && f.title; }).slice(0, 5);
  }

  function profileFaveThumbHtml(f) {
    var initial = (f.title || '?').charAt(0).toUpperCase();
    var color = f.color || '#241F45';
    return '<div class="profile-fave">' +
      '<div class="profile-fave-cover" style="' + (f.coverUrl ? 'background-image:url(' + esc(f.coverUrl) + ');' : 'background:' + esc(color) + ';') + '">' +
        (f.coverUrl ? '' : '<span>' + esc(initial) + '</span>') +
      '</div>' +
      '<div class="profile-fave-title">' + esc(f.title) + '</div>' +
    '</div>';
  }

    }
    app.innerHTML = '<div class="skeleton" style="height:320px;border-radius:16px;"></div>';
    var uid = getCurrentUser().id;

    Promise.all([
      sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.auth.getUser(),
      sb.from('reading_progress').select('series_title,current_chapter,total_chapters,status').eq('user_id', uid),
    ]).then(function (results) {
      var profile = (results[0] && results[0].data) || {};
      var authUser = results[1] && results[1].data && results[1].data.user;
      var progressRows = (results[2] && results[2].data) || [];

        if (qualifies && !seen[r.series_title]) { seen[r.series_title] = true; entriesRead++; }
      });

      var stats = profileToBadgeStats(profile);
      var earnedIds = computeEarnedBadgeIds(stats);
      var faves = normalizeFavesWeb(profile.favorites);

      var username = profile.username || 'Reader';
      var bio = profile.bio || '';
      var joinDate = authUser && authUser.created_at
        ? new Date(authUser.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
        : '';
      var theme = PROFILE_THEMES[profile.color] || PROFILE_THEMES.default;
      var initials = username.slice(0, 2).toUpperCase();

      var dailyLog = profile.daily_log || {};
      var totalHrs = Object.keys(dailyLog).length
        ? Object.values(dailyLog).reduce(function (s, h) { return s + h; }, 0)
        : (stats.hours_read || 0);

      app.innerHTML =
        '<div class="profile-hero-card">' +
          '<div class="profile-banner" style="' + (profile.banner_url ? 'background-image:url(' + esc(profile.banner_url) + ');' : 'background:linear-gradient(120deg,' + theme.gradient[0] + ',' + theme.gradient[1] + ');') + '"></div>' +
          '<div class="profile-hero-body">' +
            '<div class="profile-avatar" style="background:linear-gradient(135deg,' + theme.gradient[0] + ',' + theme.gradient[1] + ');border-color:' + theme.ring + ';">' +
              (profile.avatar_url ? '<img src="' + esc(profile.avatar_url) + '" alt="" />' : '<span>' + esc(initials) + '</span>') +
            '</div>' +
            '<div class="profile-namewrap">' +
              '<h1 class="profile-username">' + esc(username) + '</h1>' +
              '<div class="profile-bio-view" id="profileBioView">' +
                '<p class="profile-bio-text">' + (bio ? esc(bio) : '<span class="profile-bio-empty">Add a bio so people know your taste…</span>') + '</p>' +
                '<button class="profile-bio-edit-btn" id="profileBioEditBtn" type="button">Edit bio</button>' +
              '</div>' +
              '<div class="profile-bio-edit" id="profileBioEdit" style="display:none;">' +
                '<textarea id="profileBioInput" maxlength="100" placeholder="Write your bio...">' + esc(bio) + '</textarea>' +
                '<div class="profile-bio-actions">' +
                  '<button class="btn-primary" id="profileBioSave" type="button">Save</button>' +
                  '<button class="btn-ghost" id="profileBioCancel" type="button">Cancel</button>' +
                '</div>' +
              '</div>' +
              '<p class="profile-handle">@' + esc(profile.username || 'reader') + (joinDate ? ' · Joined ' + joinDate : '') + '</p>' +
            '</div>' +
          '</div>' +
        '</div>' +

        (faves.length
          ? '<div class="profile-favorites">' +
              '<div class="profile-favorites-title">Favorites</div>' +
              '<div class="profile-favorites-row">' + faves.map(profileFaveThumbHtml).join('') + '</div>' +
            '</div>'
          : '') +

        '<div class="profile-stats-row" id="profileStatsRow">' +
          profileStatCardHtml('read', 'Read', String(entriesRead), '#7B5CFF') +
          profileStatCardHtml('time', 'Time Read', fmtHrsWeb(totalHrs), '#1D9E75') +
          profileStatCardHtml('genre', 'Fav. Genre', profile.favorite_genre || '—', '#FFD700') +
        '</div>' +
        '<div class="profile-stat-detail" id="profileStatDetail" style="display:none;"></div>' +

        '<div class="card profile-streak-card">' +
          '<div class="card-title">Reading Streak' + (stats.streak_count ? ' · ' + stats.streak_count + 'd' : '') + '</div>' +
          profileStreakGridHtml(dailyLog) +
        '</div>';

      document.getElementById('profileBioEditBtn').addEventListener('click', function () {
        document.getElementById('profileBioView').style.display = 'none';
        document.getElementById('profileBioEdit').style.display = 'block';
        document.getElementById('profileBioInput').focus();
      });
      document.getElementById('profileBioCancel').addEventListener('click', function () {
        document.getElementById('profileBioEdit').style.display = 'none';
        document.getElementById('profileBioView').style.display = 'block';
      });
      document.getElementById('profileBioSave').addEventListener('click', function () {
        var clean = document.getElementById('profileBioInput').value.trim();
        var btn = this;
        btn.disabled = true;
        sb.from('profiles').update({ bio: clean }).eq('id', uid).then(function (res) {
          btn.disabled = false;
          if (res.error) { alert('Could not save bio — try again.'); return; }
          renderProfile();
        });
      });

      var statDetailEl = document.getElementById('profileStatDetail');
      var statSections = {
        read: { title: 'Reading', color: '#7B5CFF', rows: [
          ['Entries read', String(entriesRead)],
          ['Chapters read', String(stats.chapters_read)],
          ['Series in library', String(stats.series_count)],
          ['Series completed', String(stats.completed_count)],
          ['Badges earned', String(earnedIds.size)],
        ] },
        time: { title: 'Time Read', color: '#1D9E75', rows: [
          ['Total', fmtHrsWeb(totalHrs)],
          ['Current streak', stats.streak_count + 'd'],
        ] },
        genre: { title: 'Taste', color: '#FFD700', rows: [
          ['Favorite genre', profile.favorite_genre || '—'],
          ['Genres explored', String(stats.genres_count)],
          ['Ratings given', String(stats.ratings_count)],
          ['Comments', String(stats.comments_count)],
          ['Likes given', String(stats.likes_given)],
        ] },
      };
      var openStat = null;
      document.getElementById('profileStatsRow').addEventListener('click', function (e) {
        var card = e.target.closest('.profile-stat-card');
        if (!card) return;
        var key = card.getAttribute('data-stat');
        if (openStat === key) { statDetailEl.style.display = 'none'; openStat = null; return; }
        openStat = key;
        var s = statSections[key];
        statDetailEl.innerHTML = '<div class="card"><div class="card-title" style="color:' + s.color + ';">' + s.title + '</div>' +
          s.rows.map(function (r) { return '<div class="info-row"><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') +
        '</div>';
        statDetailEl.style.display = 'block';
      });
    }).catch(function () {
      app.innerHTML = '<p class="statemsg">Couldn\'t load your profile. Try again in a moment.</p>';
    });
  }

  function setActiveTab(id) {
    [navTabsEl, catRailMobile].forEach(function (rail) {
      Array.prototype.forEach.call(rail.children, function (el) {
        el.classList.toggle('active', el.getAttribute('data-cat') === id);
      });
    });
  }

  // ── Router ────────────────────────────────────────────────────────────
  function router() {
    navTabsEl.classList.remove('lib-hide');
    catRailMobile.classList.remove('lib-hide');
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'title' && parts[1]) return renderDetail(parts[1]);
    if (parts[0] === 'browse' && parts[1]) return renderBrowse(parts[1]);
    if (parts[0] === 'search' && parts[1]) return renderSearch(decodeURIComponent(parts[1]));
    if (parts[0] === 'library') return renderLibrary();
    if (parts[0] === 'profile') return renderProfile();
    return renderHome();
  }
  window.navigate = function (path) { location.hash = path; };
  window.addEventListener('hashchange', router);

  var searchInput = document.getElementById('searchInput');
  var searchDropdown = null;
  function closeSearchDropdown() {
    if (searchDropdown) { searchDropdown.remove(); searchDropdown = null; }
  }
  function showSearchDropdown(results, q) {
    closeSearchDropdown();
    searchDropdown = document.createElement('div');
    searchDropdown.className = 'search-dropdown';
    searchDropdown.innerHTML = results.slice(0, 6).map(function (m) {
      return '<a class="search-dd-item" href="#/title/' + m.id + '" data-path="/title/' + m.id + '">' +
        '<img src="' + m.coverImage.large + '" alt="" loading="lazy" />' +
        '<div><div class="search-dd-title">' + esc(titleOf(m)) + '</div><div class="search-dd-meta">' + formatLabel(m) + (m.startDate.year ? ' · ' + m.startDate.year : '') + '</div></div>' +
      '</a>';
    }).join('') +
    '<a class="search-dd-all" href="#/search/' + encodeURIComponent(q) + '" data-path="/search/' + encodeURIComponent(q) + '">See all results for "' + esc(q) + '"</a>';
    searchDropdown.addEventListener('click', function (e) {
      var link = e.target.closest('a[data-path]');
      if (!link) return;
      e.preventDefault();
      var path = link.getAttribute('data-path');
      closeSearchDropdown();
      navigate(path);
    });
    document.querySelector('.searchwrap').appendChild(searchDropdown);
  }
  searchInput.addEventListener('input', debounce(function () {
    var q = searchInput.value.trim();
    if (q.length < 2) {
      closeSearchDropdown();
      if (q.length === 0 && location.hash.indexOf('#/search') === 0) navigate('/');
      return;
    }
    searchMedia(q, null, 1).then(function (d) {
      if (!d.Page.media.length) { closeSearchDropdown(); return; }
      showSearchDropdown(d.Page.media, q);
    }).catch(function () {});
  }, 350));
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var q = searchInput.value.trim();
      if (q.length >= 2) { closeSearchDropdown(); navigate('/search/' + encodeURIComponent(q)); }
    } else if (e.key === 'Escape') {
      closeSearchDropdown();
    }
  });
  document.addEventListener('click', function (e) {
    if (searchDropdown && !searchDropdown.contains(e.target) && e.target !== searchInput) closeSearchDropdown();
  });
  window.addEventListener('hashchange', closeSearchDropdown);

  if (window.__SHARE_ID__) {
    history.replaceState(null, '', '/catalog/#/title/' + window.__SHARE_ID__);
  }
  router();
});
</script>
