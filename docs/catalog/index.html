    if (d.weekday.best >= 0) {
      slides.push({
        theme: RECAP_THEMES.navy,
        foot: "Those late nights hit different",
        html:
          '<div class="recap-slide">' +
            recapReveal('<div class="recap-eyebrow">Your rhythm</div>') +
            recapReveal('<h2 class="recap-title" style="font-size:2rem;">' + esc(d.weekday.bestName) + 's</h2>', 0.14) +
            recapBarsHtml(d.weekday) +
            recapReveal('<p class="recap-sub">were your biggest reading days.</p>', 0.3) +
            (d.peakWindow
              ? recapReveal(
                  '<div class="recap-peak-pill" style="border-color:' + d.motifColor + ';">' +
                    '<span class="recap-peak-icon" style="color:' + d.motifColor + ';">' + recapIcon('clock') + '</span>' +
                    '<span><span class="recap-peak-label">Peak reading time</span><span class="recap-peak-value">' + esc(d.peakWindow.label) + '</span></span>' +
                    '<span class="recap-peak-pct">' + d.peakWindow.pct + '%</span>' +
                  '</div>', 0.42)
              : '') +
          '</div>',
      });
    }

    if (d.longestStreak >= 2) {
      slides.push({
        theme: RECAP_THEMES.ember,
        foot: "Consistency is power",
        confetti: true,
        html:
          '<div class="recap-speedlines-spin recap-speedlines-fire"></div>' +
          '<div class="recap-slide">' +
            recapReveal('<div class="recap-eyebrow">On a roll</div>') +
            recapFlameHtml(d.accentColor) +
            '<div class="recap-stat-big" data-countup="' + d.longestStreak + '">0</div>' +
            recapReveal('<div class="recap-stat-label">DAY STREAK — YOUR LONGEST THIS HALF</div>', 0.16) +
          '</div>',
      });
    }

    // Two "favorites" beats that would otherwise both fire and push the story
    // past 10 slides. The character grid below is the stronger visual (and the
    // one the design reference leads with), so it wins when there's enough
    // real character art; this highest-rated-series slide is the fallback.
    var showFaces = d.characters && d.characters.length >= 3;
    if (d.topRated && !showFaces) {
      var favCoverStyle = d.topRated.cover ? ' style="background-image:url(' + d.topRated.cover + ')"' : '';
      slides.push({
        theme: RECAP_THEMES.crimson,
        foot: "Those moments will stay with you",
        // Spotlights this specific title's own real art as the full-bleed
        // background instead of the story-wide top-series hero — see the
        // `s.bg || cardData.heroCover` branch in fillSlide().
        bg: d.topRated.hero || null,
        html:
          recapWatermark('star') +
          '<div class="recap-slide">' +
            recapReveal('<div class="recap-eyebrow">Your favorite moment</div>') +
            recapReveal('<div class="recap-favmoment-cover"' + favCoverStyle + '></div>', 0.1) +
            recapReveal('<h2 class="recap-title" style="font-size:1.9rem;">' + esc(d.topRated.title) + '</h2>', 0.2) +
            recapReveal(recapStarsHtml(d.topRated.stars5), 0.34) +
            recapReveal('<p class="recap-sub">Your highest-rated read this half.</p>', 0.46) +
          '</div>',
      });
    }

    // Favorite Moments — real character portraits out of the reader's own top
    // series (AniList `characters`), in a manga-panel grid.
    if (showFaces) {
      var faceCells = d.characters.map(function (c, i) {
        return recapReveal(
          '<div class="recap-face-panel" style="border-color:' + d.motifColor + ';">' +
            '<img src="' + c.image + '" alt="' + esc(c.name) + '" loading="lazy" />' +
            '<span class="recap-face-name">' + esc(c.name) + '</span>' +
          '</div>', 0.11 + i * 0.085);
      }).join('');
      slides.push({
        theme: RECAP_THEMES.crimson,
        foot: "Those moments will stay with you",
        html:
          '<div class="recap-slide">' +
            recapReveal('<div class="recap-eyebrow">Faces of your half</div>') +
            '<div class="recap-face-grid">' + faceCells + '</div>' +
            recapReveal('<p class="recap-sub">The characters you spent your half with.</p>', 0.62) +
          '</div>',
      });
    }

    if (d.earnedBadgeCount > 0) {
      slides.push({
        theme: RECAP_THEMES.teal,
        foot: "Earned, not given",
        html:
          '<div class="recap-slide">' +
            recapReveal('<div class="recap-eyebrow">Real badges, really earned</div>') +
            '<div class="recap-stat-big" data-countup="' + d.earnedBadgeCount + '">0</div>' +
            recapReveal('<div class="recap-stat-label">OF ' + d.totalBadgeCount + ' BADGES UNLOCKED</div>', 0.16) +
            (d.tierLabel ? recapReveal('<div class="recap-tier-pill" style="--tier-c:' + d.tierColor + ';color:' + d.tierColor + ';">' + esc(d.tierLabel) + ' Tier</div>', 0.3) : '') +
          '</div>',
      });
    }

    var archetype = recapArchetype(d);
    slides.push({
      theme: RECAP_THEMES.violet,
      foot: "This half was uniquely yours",
      html:
        recapWatermark(archetype.icon) +
        '<div class="recap-slide">' +
          recapReveal('<div class="recap-eyebrow">Your reading personality</div>') +
          '<div class="recap-archetype-badge">' + recapIcon(archetype.icon) + '</div>' +
          recapKineticTitle('h2', archetype.title, 0.2, 'font-size:2.3rem;') +
          recapReveal('<p class="recap-sub">' + esc(archetype.desc) + '</p>', 0.44) +
        '</div>',
    });

    slides.push({
      theme: RECAP_THEMES.violet,
      foot: "Never stop turning pages",
      isFinale: true,
      html:
        '<div class="recap-slide recap-finale">' +
          '<div class="recap-eyebrow">' + esc(d.period.label) + ', wrapped</div>' +
          '<img id="recapCardPreview" class="recap-card-preview" alt="Your MangaRecap card" />' +
          '<div class="recap-finale-actions" data-recap-action>' +
            '<button class="btn-primary" id="recapDownloadBtn" type="button">Download</button>' +
            '<button class="btn-ghost" id="recapShareBtn" type="button" style="display:none;">Share</button>' +
          '</div>' +
          '<p class="recap-sub">See you at the next one.</p>' +
        '</div>',
    });

    return slides;
  }

  function recapAnimateCountUps(container) {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    Array.prototype.forEach.call(container.querySelectorAll('[data-countup]'), function (el) {
      var target = parseFloat(el.getAttribute('data-countup')) || 0;
      if (reduced) { el.textContent = Math.round(target); return; }
      var start = performance.now(), dur = 1000;
      (function step(now) {
        var p = Math.min(1, (now - start) / dur);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
        else recapCountUpImpact(el, container);
      })(performance.now());
    });
  }

  // A real "hero moment" for every big number landing: a scale-punch + glow
  // flash, a handful of particles bursting from the number itself, and a
  // light haptic tap where supported — instead of the count-up quietly
  // stopping. Skipped entirely under reduced-motion (recapAnimateCountUps
  // never calls this in that case, since it sets the value immediately).
  function recapCountUpImpact(el, container) {
    el.classList.add('recap-countup-punch');
    setTimeout(function () { el.classList.remove('recap-countup-punch'); }, 500);
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    var stageRect = container.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    var cx = elRect.left + elRect.width / 2 - stageRect.left;
    var cy = elRect.top + elRect.height / 2 - stageRect.top;
    var colors = ['#fff', 'rgba(255,255,255,0.7)'];
    for (var i = 0; i < 10; i++) {
      var p = document.createElement('span');
      p.className = 'recap-impact-spark';
      var a = (i / 10) * Math.PI * 2;
      var dist = 60 + Math.random() * 40;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
      p.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
      p.style.background = colors[i % colors.length];
      container.appendChild(p);
      (function (spark) { setTimeout(function () { spark.remove(); }, 700); })(p);
    }
  }

  function recapSpawnConfetti(container) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#E8A83C', '#7B5CFF', '#3FC9C0', '#E85FA8', '#5B8DEF'];
    for (var i = 0; i < 40; i++) {
      var p = document.createElement('span');
      p.className = 'recap-confetti-piece';
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      p.style.animationDuration = (2 + Math.random() * 1.4) + 's';
      container.appendChild(p);
    }
    setTimeout(function () {
      Array.prototype.forEach.call(container.querySelectorAll('.recap-confetti-piece'), function (el) { el.remove(); });
    }, 4200);
  }

  // Grows bookshelf spines from 0 to their real height — kept generic
  // (any [data-target-height] element) in case a future slide reuses it.
  function recapTriggerGrowth(container) {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call(container.querySelectorAll('[data-target-height]'), function (el) {
          el.style.transition = reduced ? 'none' : '';
          el.style.height = el.getAttribute('data-target-height');
        });
        Array.prototype.forEach.call(container.querySelectorAll('[data-target-width]'), function (el) {
          el.style.transition = reduced ? 'none' : '';
          el.style.width = el.getAttribute('data-target-width');
        });
      });
    });
  }

  function initRecapStory(slides, cardData) {
    var stage = document.getElementById('recapStage');
    var progressWrap = document.getElementById('recapProgress');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var AUTO_MS = 5600;
    var idx = 0;
    var timer = null;

    stage.style.setProperty('--rc', cardData.accentColor || '#7B5CFF');
    progressWrap.innerHTML = slides.map(function () { return '<div class="recap-seg"><i></i></div>'; }).join('');
    var segs = progressWrap.querySelectorAll('.recap-seg');

    // The genre particle canvas and the per-genre motif layer are gone: they
    // predate the per-slide theme system and fought it (a brown speed-line
    // motif over a navy slide). The themes now own the whole composition.
    var stopParticles = function () {};
    var heroBg = document.getElementById('recapHeroBg');
    var frameEl = document.querySelector('.recap-frame');
    var scrimEl = document.getElementById('recapScrim');
    // Cycle the reader's own art behind the whole story, independent of slide
    // changes, so the background is never a single frozen image — matches the
    // app's HeroBackground. A slide that spotlights its own title (`s.bg`)
    // pins the background and pauses the rotation while it's showing.
    var heroPool = (cardData.heroImages && cardData.heroImages.length) ? cardData.heroImages : [];
    var heroIdx = 0, heroPinned = null;
    var heroTimer = heroPool.length > 1 ? setInterval(function () {
      if (heroPinned || !heroBg) return;
      heroIdx = (heroIdx + 1) % heroPool.length;
      heroBg.style.backgroundImage = 'url(' + heroPool[heroIdx] + ')';
    }, 4800) : null;

    function renderFinaleCard() {
      var canvas = drawRecapCard(cardData);
      var img = stage.querySelector('#recapCardPreview');
      canvas.toBlob(function (blob) { if (img && blob) img.src = URL.createObjectURL(blob); });
      var dlBtn = stage.querySelector('#recapDownloadBtn');
      if (dlBtn) dlBtn.addEventListener('click', function (e) { e.stopPropagation(); downloadRecapCard(cardData); });
      var shareBtn = stage.querySelector('#recapShareBtn');
      if (shareBtn && navigator.share) {
        shareBtn.style.display = '';
        shareBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          canvas.toBlob(function (blob) {
            if (!blob) return;
            var file = new File([blob], 'mangarecap.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              navigator.share({ files: [file], title: 'My MangaRecap' }).catch(function () {});
            }
          });
        });
      }
    }

    var paused = false, segStartTime = 0, segRemainingMs = AUTO_MS;

    function startSegTimer() {
      segRemainingMs = AUTO_MS;
      segStartTime = Date.now();
      var s = slides[idx];
      if (s.isFinale) return;
      var bar = segs[idx].querySelector('i');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          bar.style.transition = reduced ? 'none' : 'width ' + AUTO_MS + 'ms linear';
          bar.style.width = '100%';
        });
      });
      clearTimeout(timer);
      timer = setTimeout(function () { go(1); }, AUTO_MS);
    }
    function pauseSegTimer() {
      var bar = segs[idx] && segs[idx].querySelector('i');
      if (!bar) return;
      segRemainingMs = Math.max(0, AUTO_MS - (Date.now() - segStartTime));
      bar.style.width = getComputedStyle(bar).width;
      bar.style.transition = 'none';
      clearTimeout(timer);
    }
    function resumeSegTimer() {
      var s = slides[idx];
      if (s.isFinale) return;
      var bar = segs[idx] && segs[idx].querySelector('i');
      segStartTime = Date.now() - (AUTO_MS - segRemainingMs);
      if (bar) {
        requestAnimationFrame(function () {
          bar.style.transition = reduced ? 'none' : 'width ' + segRemainingMs + 'ms linear';
          bar.style.width = '100%';
        });
      }
      clearTimeout(timer);
      timer = setTimeout(function () { go(1); }, segRemainingMs);
    }

    function fillSlide() {
      var s = slides[idx];
      // Real cover art wins whenever it's available — a slide can spotlight
      // its own title (e.g. the favorite-moment slide) via `s.bg`, otherwise
      // every slide shares the story-wide hero cover. The flat color wash
      // only ever shows for the rare reader with zero resolvable covers;
      // otherwise the stage itself goes transparent so the real photo
      // sitting behind it (recapHeroBg) is what's actually visible.
      // The slide's own colour field is the base; the reader's real art sits
      // INSIDE it at the theme's opacity rather than replacing it, so a cream
      // "paper" slide stays paper instead of becoming another photo.
      var t = s.theme || RECAP_THEMES.violet;
      var isPaper = t.ink !== '#FFFFFF';
      heroPinned = s.bg || null;
      var bgUrl = s.bg || heroPool[heroIdx] || cardData.heroCover;
      // Colour field on the frame (below the art), ink vars on the stage.
      if (frameEl) frameEl.style.setProperty('--slide-bg', recapThemeCss(t));
      stage.style.color = t.ink;
      stage.style.setProperty('--ink', t.ink);
      stage.style.setProperty('--dim', t.dim);
      stage.style.setProperty('--accent', t.accent);
      stage.classList.toggle('recap-paper', isPaper);
      if (scrimEl) {
        scrimEl.style.setProperty('--scrim-a', recapHexToRgba(t.bg[0], isPaper ? 0.86 : 0.70));
        scrimEl.style.setProperty('--scrim-b', recapHexToRgba(t.bg[0], isPaper ? 0.93 : 0.82));
        scrimEl.style.setProperty('--scrim-c', recapHexToRgba(t.bg[1], isPaper ? 0.99 : 0.97));
        scrimEl.style.setProperty('--scrim-d', recapHexToRgba(t.bg[1], 1));
      }
      if (heroBg) {
        if (bgUrl) {
          heroBg.style.backgroundImage = 'url(' + bgUrl + ')';
          heroBg.style.opacity = t.art;
          heroBg.style.display = '';
        } else { heroBg.style.display = 'none'; }
      }
      stage.innerHTML = s.html +
        (s.foot ? '<div class="recap-foot recap-reveal" style="animation-delay:0.76s">' + esc(s.foot) + '</div>' : '');
      Array.prototype.forEach.call(segs, function (seg, i) {
        var bar = seg.querySelector('i');
        bar.style.transition = 'none';
        bar.style.width = i < idx ? '100%' : '0%';
      });
      recapAnimateCountUps(stage);
      recapTriggerGrowth(stage);
      if (s.confetti) recapSpawnConfetti(stage);
      if (s.isFinale) renderFinaleCard();
      // Always start fresh for the newly-shown slide (correct full duration
      // regardless of prior slide's remaining time), then immediately
      // freeze it if the story is currently paused — avoids computing a
      // stale remaining-time from the previous slide's segStartTime.
      startSegTimer();
      if (paused) pauseSegTimer();
    }

    // direction: 0 = initial paint (no transition), 1 = forward, -1 = back
    function paint(direction) {
      if (!direction || reduced) { fillSlide(); return; }
      stage.classList.add(direction > 0 ? 'recap-exit-l' : 'recap-exit-r');
      setTimeout(function () {
        stage.classList.remove('recap-exit-l', 'recap-exit-r');
        fillSlide();
        stage.classList.add(direction > 0 ? 'recap-enter-r' : 'recap-enter-l');
        setTimeout(function () { stage.classList.remove('recap-enter-l', 'recap-enter-r'); }, 500);
      }, 160);
    }
    function go(direction) {
      var target = idx + direction;
      if (target < 0 || target >= slides.length) return;
      idx = target;
      paint(direction);
    }
    function togglePause() {
      paused = !paused;
      var btn = document.getElementById('recapPauseBtn');
      if (btn) btn.innerHTML = paused ? RECAP_CTRL_ICONS.play : RECAP_CTRL_ICONS.pause;
      if (paused) pauseSegTimer(); else resumeSegTimer();
    }
    function replay() {
      paused = false;
      var btn = document.getElementById('recapPauseBtn');
      if (btn) btn.innerHTML = RECAP_CTRL_ICONS.pause;
      idx = 0;
      paint(0);
    }
    function close() {
      clearTimeout(timer);
      if (heroTimer) clearInterval(heroTimer);
      stopParticles();
      document.removeEventListener('keydown', keyHandler);
      location.hash = '#/profile';
    }
    function keyHandler(e) {
      if (e.key === 'ArrowRight') go(1);
      else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'Escape') close();
      else if (e.key === ' ') { e.preventDefault(); togglePause(); }
    }

    stage.addEventListener('click', function (e) {
      if (e.target.closest('[data-recap-action]')) return;
      var r = stage.getBoundingClientRect();
      var x = e.clientX - r.left;
      if (x < r.width * 0.3) go(-1); else go(1);
    });
    document.getElementById('recapClose').addEventListener('click', close);
    var pauseBtnEl = document.getElementById('recapPauseBtn');
    if (pauseBtnEl) pauseBtnEl.addEventListener('click', function (e) { e.stopPropagation(); togglePause(); });
    var replayBtnEl = document.getElementById('recapReplayBtn');
    if (replayBtnEl) replayBtnEl.addEventListener('click', function (e) { e.stopPropagation(); replay(); });
    document.addEventListener('keydown', keyHandler);

    var touchStartY = null;
    stage.addEventListener('touchstart', function (e) { touchStartY = e.touches[0].clientY; }, { passive: true });
    stage.addEventListener('touchend', function (e) {
      if (touchStartY == null) return;
      var dy = e.changedTouches[0].clientY - touchStartY;
      touchStartY = null;
      if (dy > 80) close();
    }, { passive: true });

    paint(0);
  }

  function renderRecap() {
    setActiveTab(null);
    navTabsEl.classList.add('lib-hide');
    catRailMobile.classList.add('lib-hide');
    if (!getCurrentUser()) {
      app.innerHTML = '<div class="lib-signedout"><h1 class="section-title">MangaRecap</h1><p>Sign in to see your MangaRecap, synced with the app.</p></div>';
      return;
    }
    app.innerHTML = '<div class="skeleton" style="height:320px;border-radius:16px;"></div>';
    var uid = getCurrentUser().id;
    var period = recapPeriod();
    var startIso = period.start.toISOString();
    var endIso = period.end.toISOString();

    Promise.all([
      sb.from('profiles').select('username,daily_log,hour_log,favorite_genre,chapters_read,hours_read,streak_count,series_count,friends_count,comments_count,likes_given,completed_count,night_reads,genres_count,shares_count,manga_count,ratings_count,created_at,avatar_url').eq('id', uid).maybeSingle(),
      sb.from('reading_progress').select('series_title,status,current_chapter,updated_at').eq('user_id', uid).gte('updated_at', startIso).lte('updated_at', endIso),
      sb.from('comments').select('id', { count: 'exact', head: true }).eq('user_id', uid).gte('created_at', startIso).lte('created_at', endIso),
      sb.from('series_ratings').select('series_title', { count: 'exact', head: true }).eq('user_id', uid).gte('created_at', startIso).lte('created_at', endIso),
      sb.from('series_ratings').select('series_title,stars,created_at').eq('user_id', uid).gte('created_at', startIso).lte('created_at', endIso).order('stars', { ascending: false }).limit(1),
    ]).then(function (results) {
      var profile = (results[0] && results[0].data) || {};
      var progressRows = (results[1] && results[1].data) || [];
      var commentsCount = (results[2] && results[2].count) || 0;
      var ratingsCount = (results[3] && results[3].count) || 0;
      var topRatedRow = (results[4] && results[4].data && results[4].data[0]) || null;
      var dailyLog = profile.daily_log || {};

      var keysInRange = recapKeysInRange(dailyLog, period.start, period.end);
      var hoursRead = keysInRange.reduce(function (s, k) { return s + (dailyLog[k] || 0); }, 0);
      var badgeStats = profileToBadgeStats(profile);
      var earnedIds = computeEarnedBadgeIds(badgeStats);
      var topGrade = highestGradeEarned(earnedIds);

      var data = {
        username: profile.username || 'Reader',
        period: period,
        totalDaysInPeriod: Math.round((period.end - period.start) / 86400000) + 1,
        hoursRead: hoursRead,
        readingDays: keysInRange.length,
        longestStreak: recapLongestStreak(dailyLog, period.start, period.end),
        weekday: recapWeekdayBreakdown(dailyLog, period.start, period.end),
        seriesTouched: progressRows.length,
        // Chapters actually reached across the series they touched this half —
        // summed from their own reading_progress rows, not the lifetime
        // chapters_read counter (which spans all time).
        chaptersInPeriod: progressRows.reduce(function (s, r) { return s + (r.current_chapter || 0); }, 0),
        commentsCount: commentsCount,
        ratingsCount: ratingsCount,
        favoriteGenre: profile.favorite_genre || null,
        tierLabel: topGrade ? BADGE_GRADES[topGrade].label : null,
        tierColor: topGrade ? BADGE_GRADES[topGrade].color : '#7B5CFF',
      };
      // Personalize the accent color to the reader's own real earned tier —
      // the same "colors dictated by your own data" principle Spotify uses,
      // rather than an arbitrary rotating palette.
      data.accentColor = data.tierColor;
      data.theme = recapThemeFor(data.favoriteGenre);
      data.dailyLog = dailyLog;
      // Real peak reading window from the hour-of-day histogram. hour_log was
      // added alongside this feature, so it's empty until the reader logs
      // sessions from here on — the slide is skipped, never faked.
      data.peakWindow = recapPeakWindow(profile.hour_log);
      // Real achievement snapshot — the app's own badge engine, same numbers.
      data.earnedBadgeCount = earnedIds.size;
      data.totalBadgeCount = ALL_BADGES.length;
      // Real "favorite moment" analog — the reader's own actual highest-
      // rated series this half (1-10 scale, converted to 5 stars), not a
      // fabricated emotional moment there's no data to back.
      data.topRated = topRatedRow
        ? { title: topRatedRow.series_title, stars5: topRatedRow.stars / 2 }
        : null;

      data.stats = [
        { value: Math.round(data.hoursRead), label: 'HOURS READ' },
        { value: String(data.readingDays), label: 'DAYS ACTIVE' },
        { value: String(data.longestStreak), label: 'LONGEST STREAK' },
        { value: String(data.seriesTouched), label: 'SERIES KEPT UP WITH' },
      ].concat(data.favoriteGenre ? [{ value: data.favoriteGenre, label: 'FAVORITE GENRE' }] : []);
      data.periodLabel = period.label;

      // Real "Top Series" ranking from the reader's own reading_progress
      // rows, with a best-effort real art lookup per title via the
      // lightweight recapArtFor query (see docs/assets/anilist.js?v=20260909c) — text-
      // only fallback if a title doesn't resolve cleanly, never a wrong or
      // guessed cover.
      var topSeriesRaw = progressRows.slice()
        .sort(function (a, b) { return (b.current_chapter || 0) - (a.current_chapter || 0); })
        .slice(0, 3);
      var coverLookups = topSeriesRaw.map(function (row) {
        return recapArtFor(row.series_title)
          .then(function (m) {
            // AniList precomputes a real dominant color per cover — reuse it
            // to personalize the recap's motif/particle color instead of
            // guessing or sampling pixels ourselves.
            return {
              title: row.series_title, chapters: row.current_chapter || 0,
              cover: (m && m.coverImage && m.coverImage.large) || null,
              // Banner art (wide promo/key-art crop, no logo baked in) is
              // strongly preferred for the full-bleed hero specifically —
              // falls back to the highest-res cover when a title has none.
              hero: (m && m.bannerImage) || (m && m.coverImage && (m.coverImage.extraLarge || m.coverImage.large)) || null,
              color: (m && m.coverImage && m.coverImage.color) || null,
              genres: (m && m.genres) || [],
              characters: (((m && m.characters && m.characters.edges) || [])
                .map(function (e) {
                  return {
                    name: (e && e.node && e.node.name && e.node.name.full) || '',
                    image: (e && e.node && e.node.image && (e.node.image.large || e.node.image.medium)) || null,
                  };
                })
                .filter(function (c) { return c.image; })),
            };
          })
          .catch(function () { return { title: row.series_title, chapters: row.current_chapter || 0, cover: null, hero: null, color: null, genres: [], characters: [] }; });
      });
      // Hard timeout so a slow/unreachable AniList can never block the whole
      // Recap from rendering — falls back to text-only titles past 5s. (The
      // old 2.5s cutoff was tuned against a much heavier query — see the
      // comment on recapArtFor — and was losing the race often enough that
      // the "no art" fallback was the common case, not the rare one.)
      var coverFallback = topSeriesRaw.map(function (row) {
        return { title: row.series_title, chapters: row.current_chapter || 0, cover: null, hero: null, color: null, genres: [], characters: [] };
      });
      var coverLookupsWithTimeout = new Promise(function (resolve) {
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; resolve(coverFallback); } }, 5000);
        Promise.all(coverLookups).then(function (v) {
          if (!settled) { settled = true; clearTimeout(timer); resolve(v); }
        });
      });

      // Same best-effort real-art lookup for the reader's own "favorite
      // moment" (their highest-rated series this half) — that slide gets to
      // spotlight its own real art instead of borrowing the top series' hero.
      var topRatedCoverWithTimeout = new Promise(function (resolve) {
        if (!data.topRated) { resolve(null); return; }
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; resolve(null); } }, 5000);
        recapArtFor(data.topRated.title).then(function (m) {
          var cover = (m && m.coverImage && (m.coverImage.extraLarge || m.coverImage.large)) || null;
          var hero = (m && m.bannerImage) || cover || null;
          if (!settled) { settled = true; clearTimeout(timer); resolve({ cover: cover, hero: hero }); }
        }).catch(function () { if (!settled) { settled = true; clearTimeout(timer); resolve({ cover: null, hero: null }); } });
      });

      Promise.all([coverLookupsWithTimeout, topRatedCoverWithTimeout]).then(function (combined) {
        var topSeries = combined[0];
        data.topSeries = topSeries;
        if (data.topRated) {
          data.topRated.cover = combined[1].cover;
          data.topRated.hero = combined[1].hero;
        }
        data.motifFamily = recapMotifFamilyFor(data.favoriteGenre);
        data.genreBreakdown = recapGenreBreakdown(topSeries);

        // Favorite Moments grid — real characters from the reader's own top
        // series, interleaved round-robin so the grid spans several series
        // rather than six faces from whichever resolved first.
        var faces = [], seenFace = {};
        for (var round = 0; round < 6; round++) {
          topSeries.forEach(function (s) {
            var c = (s.characters || [])[round];
            if (c && !seenFace[c.image]) { seenFace[c.image] = 1; faces.push(c); }
          });
        }
        data.characters = faces.slice(0, 6);

        // Personalize the theme/motif color beyond genre alone using
        // AniList's own real precomputed color for the reader's most-read
        // cover — falls back to the genre palette if there's no top cover
        // or AniList hasn't computed one for that title (never fabricated).
        var topColor = (topSeries[0] && topSeries[0].color) || null;
        if (topColor) {
          data.theme = { particle: data.theme.particle, colors: [topColor, data.theme.colors[1] || data.theme.colors[0]] };
        }
        data.motifColor = topColor || data.theme.colors[0];
        // Real art of the reader's own most-read series, shown as a
        // persistent full-bleed background behind the whole story (any
        // slide can override it with its own `bg` — see the favorite-
        // moment slide in buildRecapSlides) — the actual art of a title
        // they actually read, same source as every other cover on the site.
        data.heroCover = (topSeries[0] && (topSeries[0].hero || topSeries[0].cover)) || null;
        // Every resolved piece of the reader's own art, deduped — cycled
        // behind the whole story so the background actually shows what they
        // read, not one borrowed hero image (matches the app's heroImages).
        data.heroImages = [];
        topSeries.concat([data.topRated]).forEach(function (s) {
          if (s && s.hero && data.heroImages.indexOf(s.hero) === -1) data.heroImages.push(s.hero);
        });
        if (!data.heroImages.length && data.heroCover) data.heroImages.push(data.heroCover);

        app.innerHTML =
          '<div class="recap-overlay" id="recapOverlay">' +
            '<div class="recap-frame">' +
              '<div class="recap-progress" id="recapProgress"></div>' +
              '<div class="recap-brandmark"><img src="/assets/adaptive-icon.png" alt="" width="16" height="16" decoding="async" />MangaRecap</div>' +
              '<button class="recap-close" id="recapClose" type="button" aria-label="Close">&times;</button>' +
              '<div class="recap-controls">' +
                '<button class="recap-ctrl-btn" id="recapPauseBtn" type="button" aria-label="Pause">' + RECAP_CTRL_ICONS.pause + '</button>' +
                '<button class="recap-ctrl-btn" id="recapReplayBtn" type="button" aria-label="Replay from start">' + RECAP_CTRL_ICONS.replay + '</button>' +
              '</div>' +
              (data.heroCover ? '<div class="recap-hero-bg" id="recapHeroBg"></div>' : '') +
              '<div class="recap-scrim" id="recapScrim" aria-hidden="true"></div>' +
              '<div class="recap-stage" id="recapStage"></div>' +
              '<div class="recap-halftone" aria-hidden="true"></div>' +
              '<div class="recap-grain" aria-hidden="true"></div>' +
            '</div>' +
          '</div>';
        initRecapStory(buildRecapSlides(data), data);
      });
    }).catch(function () {
      app.innerHTML = '<p class="statemsg">Couldn\'t load your Recap. Try again in a moment.</p>';
    });
  }

  function profileStatCardHtml(key, label, value, color) {
    return '<button class="profile-stat-card" type="button" data-stat="' + key + '" style="--stat-c:' + color + ';">' +
      '<div class="profile-stat-value">' + esc(value) + '</div>' +
      '<div class="profile-stat-label">' + esc(label) + '</div>' +
    '</button>';
  }

  function normalizeFavesWeb(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.map(function (f) {
      if (typeof f === 'string') return { title: f };
      if (f && !f.title && (f.seriesTitle || f.series_title || f.name)) {
        var copy = {};
        for (var k in f) { if (f.hasOwnProperty(k)) copy[k] = f[k]; }
        copy.title = f.seriesTitle || f.series_title || f.name;
        return copy;
      }
      return f;
    }).filter(function (f) { return f && f.title; }).slice(0, 5);
  }

  function profileFaveThumbHtml(f) {
    var initial = (f.title || '?').charAt(0).toUpperCase();
    var color = f.color || '#241F45';
    return '<div class="profile-fave">' +
      '<div class="profile-fave-cover" style="' + (f.coverUrl ? 'background-image:url(' + esc(f.coverUrl) + ');' : 'background:' + esc(color) + ';') + '">' +
        (f.coverUrl ? '' : '<span>' + esc(initial) + '</span>') +
      '</div>' +
      '<div class="profile-fave-title">' + esc(f.title) + '</div>' +
    '</div>';
  }

  function renderProfile() {
    setActiveTab(null);
    navTabsEl.classList.add('lib-hide');
    catRailMobile.classList.add('lib-hide');
    if (!getCurrentUser()) {
      app.innerHTML =
        '<div class="lib-signedout">' +
          '<h1 class="section-title">My Profile</h1>' +
          '<p>Sign in to see your profile, synced with the app.</p>' +
        '</div>';
      return;
    }
    app.innerHTML = '<div class="skeleton" style="height:320px;border-radius:16px;"></div>';
    var uid = getCurrentUser().id;

    Promise.all([
      sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.auth.getUser(),
      sb.from('reading_progress').select('series_title,current_chapter,total_chapters,status,updated_at').eq('user_id', uid).order('updated_at', { ascending: false }),
    ]).then(function (results) {
      var profile = (results[0] && results[0].data) || {};
      var authUser = results[1] && results[1].data && results[1].data.user;
      var progressRows = (results[2] && results[2].data) || [];
      var currentlyReading = progressRows.filter(function (r) { return r.status === 'reading'; })[0];

      var entriesRead = 0;
      var seen = {};
      progressRows.forEach(function (r) {
        var qualifies = r.status === 'completed' || (r.total_chapters > 0 && r.current_chapter / r.total_chapters >= 0.5);
        if (qualifies && !seen[r.series_title]) { seen[r.series_title] = true; entriesRead++; }
      });

      var stats = profileToBadgeStats(profile);
      var earnedIds = computeEarnedBadgeIds(stats);
      var faves = normalizeFavesWeb(profile.favorites);

      var username = profile.username || 'Reader';
      var bio = profile.bio || '';
      var joinDate = authUser && authUser.created_at
        ? new Date(authUser.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
        : '';
      var theme = PROFILE_THEMES[profile.color] || PROFILE_THEMES.default;
      var initials = username.slice(0, 2).toUpperCase();

      var dailyLog = profile.daily_log || {};
      var totalHrs = Object.keys(dailyLog).length
        ? Object.values(dailyLog).reduce(function (s, h) { return s + h; }, 0)
        : (stats.hours_read || 0);

      // Real earned tier + real streak length drive the avatar ring — no
      // separate fake "unlock" system, just a read-only reflection of
      // computeEarnedBadgeIds()/stats already on this page.
      var topGrade = highestGradeEarned(earnedIds);
      var tierColor = topGrade ? BADGE_GRADES[topGrade].color : theme.ring;
      var ringWidth = Math.min(6, 2 + Math.floor((stats.streak_count || 0) / 10));

      var readingStripHtml = currentlyReading
        ? '<div class="profile-reading-strip">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' +
            '<span>Currently reading <b>' + esc(currentlyReading.series_title) + '</b>' +
            (currentlyReading.total_chapters ? ' · Ch. ' + currentlyReading.current_chapter + ' of ' + currentlyReading.total_chapters : ' · Ch. ' + currentlyReading.current_chapter) +
            '</span>' +
          '</div>'
        : '';

      var paceSparklineHtml = profilePaceSparklineHtml(dailyLog);

      // Best badges first, so the shelf opens on what was hardest to get
      // rather than on whatever happens to sit first in ALL_BADGES.
      var earnedBadges = ALL_BADGES
        .filter(function (b) { return earnedIds.has(b.id); })
        .sort(function (a, b) { return GRADE_ORDER.indexOf(b.grade) - GRADE_ORDER.indexOf(a.grade); });
      var BADGE_PREVIEW = 12;

      function badgeChipHtml(b) {
        var g = BADGE_GRADES[b.grade] || {};
        return '<div class="profile-badge-chip" title="' + esc(b.name + ': ' + b.desc) + '"' +
          ' style="--tier-c:' + g.border + ';--tier-bg:' + g.bg + ';">' +
          '<span class="ico">' + b.icon + '</span>' +
          '<span class="nm">' + esc(b.name) + '</span>' +
        '</div>';
      }

      var badgesHtml =
        '<div class="profile-badges">' +
          '<div class="profile-section-head">' +
            '<span class="profile-section-title">Badges earned' + (earnedBadges.length ? ' · ' + earnedBadges.length : '') + '</span>' +
            '<a class="profile-section-link" href="/badges/">All ' + ALL_BADGES.length + ' badges</a>' +
          '</div>' +
          (earnedBadges.length
            ? '<div class="profile-badge-grid">' +
                earnedBadges.slice(0, BADGE_PREVIEW).map(badgeChipHtml).join('') +
              '</div>'
            : '<p class="profile-badges-empty">No badges yet. Read a chapter and the first one is already yours.</p>') +
        '</div>';

      var nextUp = nextUpBadges(stats, earnedIds, 3);
      var nextUpHtml = nextUp.length
        ? '<div class="card">' +
            '<div class="card-title">Next up</div>' +
            nextUp.map(function (n) {
              var g = BADGE_GRADES[n.badge.grade] || {};
              return '<div class="profile-next-row" style="--tier-c:' + g.border + ';">' +
                '<span class="profile-next-ico">' + n.badge.icon + '</span>' +
                '<span class="profile-next-body">' +
                  '<span class="profile-next-name">' + esc(n.badge.name) + '</span>' +
                  '<span class="profile-next-bar"><i style="width:' + Math.round(n.pct * 100) + '%;"></i></span>' +
                '</span>' +
                '<span class="profile-next-count">' + n.current + ' / ' + n.target + '</span>' +
              '</div>';
            }).join('') +
          '</div>'
        : '';

      var friendsCount = stats.friends_count || 0;
      var metaHtml =
        '<div class="profile-meta-row">' +
          (topGrade
            ? '<span class="profile-meta-pill tier" style="--tier-c:' + tierColor + ';">'
                + '<b>' + BADGE_GRADES[topGrade].label + '</b> tier</span>'
            : '') +
          '<span class="profile-meta-pill"><b>' + friendsCount + '</b> ' + (friendsCount === 1 ? 'friend' : 'friends') + '</span>' +
          (stats.streak_count ? '<span class="profile-meta-pill">🔥 <b>' + stats.streak_count + '</b> day streak</span>' : '') +
          // No Settings link: the drawer's Settings entry already resolves to
          // this page, so linking one from here would point at itself.
          '<a class="profile-meta-pill" href="#/library">My Library</a>' +
          (joinDate ? '<span class="profile-meta-pill">Joined ' + esc(joinDate) + '</span>' : '') +
        '</div>';

      app.innerHTML =
        '<div class="profile-page">' +
        '<div class="profile-hero-card">' +
          '<div class="profile-banner" style="' + (profile.banner_url ? 'background-image:url(' + esc(profile.banner_url) + ');' : 'background:linear-gradient(120deg,' + theme.gradient[0] + ',' + theme.gradient[1] + ');') + '"></div>' +
          '<div class="profile-hero-body">' +
            '<div class="profile-avatar" title="' + (topGrade ? BADGE_GRADES[topGrade].label + ' tier' : '') + '" style="background:linear-gradient(135deg,' + theme.gradient[0] + ',' + theme.gradient[1] + ');border-color:' + theme.ring + ';box-shadow:0 0 0 4px var(--bg-panel), 0 0 0 ' + (4 + ringWidth) + 'px ' + tierColor + ';">' +
              (profile.avatar_url ? '<img src="' + esc(profile.avatar_url) + '" alt="' + esc(username) + '’s avatar" />' : '<span>' + esc(initials) + '</span>') +
            '</div>' +
            '<div class="profile-namewrap">' +
              '<h1 class="profile-username">' + esc(username) + '</h1>' +
              '<div class="profile-bio-view" id="profileBioView">' +
                '<p class="profile-bio-text">' + (bio ? esc(bio) : '<span class="profile-bio-empty">Add a bio so people know your taste…</span>') + '</p>' +
                '<button class="profile-bio-edit-btn" id="profileBioEditBtn" type="button">Edit bio</button>' +
              '</div>' +
              '<div class="profile-bio-edit" id="profileBioEdit" style="display:none;">' +
                '<textarea id="profileBioInput" maxlength="100" placeholder="Write your bio...">' + esc(bio) + '</textarea>' +
                '<div class="profile-bio-actions">' +
                  '<button class="btn-primary" id="profileBioSave" type="button">Save</button>' +
                  '<button class="btn-ghost" id="profileBioCancel" type="button">Cancel</button>' +
                '</div>' +
              '</div>' +
              '<p class="profile-handle">@' + esc(profile.username || 'reader') + '</p>' +
            '</div>' +
            '<button class="profile-signout-btn" id="profileSignOutBtn" type="button">Sign out</button>' +
          '</div>' +
        '</div>' +

        metaHtml +
        readingStripHtml +

        '<div class="profile-cols">' +
          '<div class="profile-main">' +
            '<div class="profile-stats-row" id="profileStatsRow">' +
              // Chapters, not the derived entry count, so this reads the same
              // number the app shows. Entries moved to its own card rather
              // than hiding behind a vague "Read" label that meant neither.
              profileStatCardHtml('read', 'Chapters Read', String(stats.chapters_read || 0), '#7B5CFF') +
              profileStatCardHtml('series', 'Series Read', String(entriesRead), '#E85FA8') +
              profileStatCardHtml('time', 'Time Read', fmtHrsWeb(totalHrs), '#1D9E75') +
              profileStatCardHtml('genre', 'Fav. Genre', profile.favorite_genre || '—', '#FFD700') +
            '</div>' +
            '<div class="profile-stat-detail" id="profileStatDetail" style="display:none;"></div>' +

            (faves.length
              ? '<div class="profile-favorites">' +
                  '<div class="profile-favorites-title">Favorites</div>' +
                  '<div class="profile-favorites-row">' + faves.map(profileFaveThumbHtml).join('') + '</div>' +
                '</div>'
              : '') +

            badgesHtml +
          '</div>' +

          '<aside class="profile-rail">' +
            '<div class="card profile-streak-card">' +
              '<div class="card-title">Reading Streak' + (stats.streak_count ? ' · ' + stats.streak_count + 'd' : '') + '</div>' +
              profileStreakGridHtml(dailyLog) +
            '</div>' +
            (paceSparklineHtml
              ? '<div class="card"><div class="card-title">Reading Pace · last 12 weeks</div>' + paceSparklineHtml + '</div>'
              : '') +
            nextUpHtml +
          '</aside>' +
        '</div>' +
        '</div>';

      document.getElementById('profileSignOutBtn').addEventListener('click', function () {
        signOut().then(function () { window.location.hash = '#/'; });
      });
      document.getElementById('profileBioEditBtn').addEventListener('click', function () {
        document.getElementById('profileBioView').style.display = 'none';
        document.getElementById('profileBioEdit').style.display = 'block';
        document.getElementById('profileBioInput').focus();
      });
      document.getElementById('profileBioCancel').addEventListener('click', function () {
        document.getElementById('profileBioEdit').style.display = 'none';
        document.getElementById('profileBioView').style.display = 'block';
      });
      document.getElementById('profileBioSave').addEventListener('click', function () {
        var clean = document.getElementById('profileBioInput').value.trim();
        var btn = this;
        btn.disabled = true;
        sb.from('profiles').update({ bio: clean }).eq('id', uid).then(function (res) {
          btn.disabled = false;
          if (res.error) { alert('Could not save bio — try again.'); return; }
          renderProfile();
        });
      });

      var statDetailEl = document.getElementById('profileStatDetail');
      var statSections = {
        read: { title: 'Reading', color: '#7B5CFF', rows: [
          ['Chapters read', String(stats.chapters_read)],
          ['Badges earned', String(earnedIds.size) + ' of ' + ALL_BADGES.length],
          ['Highest tier', topGrade ? BADGE_GRADES[topGrade].label : '—'],
        ] },
        series: { title: 'Series', color: '#E85FA8', rows: [
          // "Read" here means finished or at least half way in, which is a
          // narrower thing than what's sitting in the library.
          ['Series read', String(entriesRead)],
          ['Series in library', String(stats.series_count)],
          ['Series completed', String(stats.completed_count)],
        ] },
        time: { title: 'Time Read', color: '#1D9E75', rows: [
          ['Total', fmtHrsWeb(totalHrs)],
          ['Current streak', stats.streak_count + 'd'],
        ] },
        genre: { title: 'Taste', color: '#FFD700', rows: [
          ['Favorite genre', profile.favorite_genre || '—'],
          ['Genres explored', String(stats.genres_count)],
          ['Ratings given', String(stats.ratings_count)],
          ['Comments', String(stats.comments_count)],
          ['Likes given', String(stats.likes_given)],
        ] },
      };
      var openStat = null;
      document.getElementById('profileStatsRow').addEventListener('click', function (e) {
        var card = e.target.closest('.profile-stat-card');
        if (!card) return;
        var key = card.getAttribute('data-stat');
        if (openStat === key) { statDetailEl.style.display = 'none'; openStat = null; return; }
        openStat = key;
        var s = statSections[key];
        statDetailEl.innerHTML = '<div class="card"><div class="card-title" style="color:' + s.color + ';">' + s.title + '</div>' +
          s.rows.map(function (r) { return '<div class="info-row"><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') +
        '</div>';
        statDetailEl.style.display = 'block';
      });
    }).catch(function () {
      app.innerHTML = '<p class="statemsg">Couldn\'t load your profile. Try again in a moment.</p>';
    });
  }

  function setActiveTab(id) {
    [navTabsEl, catRailMobile].forEach(function (rail) {
      Array.prototype.forEach.call(rail.children, function (el) {
        el.classList.toggle('active', el.getAttribute('data-cat') === id);
      });
    });
  }

  // ── Router ────────────────────────────────────────────────────────────
  function pulseLoadingBar() {
    var bar = document.getElementById('toploader');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'toploader';
      bar.className = 'toploader';
      document.body.insertBefore(bar, document.body.firstChild);
    }
    bar.classList.remove('done');
    bar.style.width = '0%';
    requestAnimationFrame(function () { bar.style.width = '75%'; });
    clearTimeout(bar._doneTimer);
    bar._doneTimer = setTimeout(function () {
      bar.style.width = '100%';
      setTimeout(function () { bar.classList.add('done'); }, 200);
    }, 380);
  }

  function router() {
    pulseLoadingBar();
    navTabsEl.classList.remove('lib-hide');
    catRailMobile.classList.remove('lib-hide');
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'title' && parts[1]) return /^\d+$/.test(parts[1]) ? renderDetail(parts[1]) : renderPoolDetail(parts[1]);
    if (parts[0] === 'browse' && parts[1]) return renderBrowse(parts[1]);
    if (parts[0] === 'search' && parts[1]) return renderSearch(decodeURIComponent(parts[1]));
    if (parts[0] === 'library') return renderLibrary();
    if (parts[0] === 'profile') return renderProfile();
    if (parts[0] === 'recap') return renderRecap();
    return renderHome();
  }
  window.navigate = function (path) { location.hash = path; };
  window.addEventListener('hashchange', router);

  var searchInput = document.getElementById('searchInput');
  var searchDropdown = null;
  function closeSearchDropdown() {
    if (searchDropdown) { searchDropdown.remove(); searchDropdown = null; }
  }
  function showSearchDropdown(results, q) {
    closeSearchDropdown();
    searchDropdown = document.createElement('div');
    searchDropdown.className = 'search-dropdown';
    searchDropdown.innerHTML = results.slice(0, 6).map(function (m) {
      return '<a class="search-dd-item" href="#/title/' + m.id + '" data-path="/title/' + m.id + '">' +
        '<img src="' + m.coverImage.large + '" alt="' + esc(titleOf(m)) + ' cover art" loading="lazy" />' +
        '<div><div class="search-dd-title">' + esc(titleOf(m)) + '</div><div class="search-dd-meta">' + formatLabel(m) + (m.startDate.year ? ' · ' + m.startDate.year : '') + '</div></div>' +
      '</a>';
    }).join('') +
    '<a class="search-dd-all" href="#/search/' + encodeURIComponent(q) + '" data-path="/search/' + encodeURIComponent(q) + '">See all results for "' + esc(q) + '"</a>';
    searchDropdown.addEventListener('click', function (e) {
      var link = e.target.closest('a[data-path]');
      if (!link) return;
      e.preventDefault();
      var path = link.getAttribute('data-path');
      closeSearchDropdown();
      navigate(path);
    });
    document.querySelector('.searchwrap').appendChild(searchDropdown);
  }
  searchInput.addEventListener('input', debounce(function () {
    var q = searchInput.value.trim();
    if (q.length < 2) {
      closeSearchDropdown();
      if (q.length === 0 && location.hash.indexOf('#/search') === 0) navigate('/');
      return;
    }
    searchMedia(q, null, 1).then(function (d) {
      if (!d.Page.media.length) { closeSearchDropdown(); return; }
      showSearchDropdown(d.Page.media, q);
    }).catch(function () {});
  }, 350));
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var q = searchInput.value.trim();
      if (q.length >= 2) { closeSearchDropdown(); navigate('/search/' + encodeURIComponent(q)); }
    } else if (e.key === 'Escape') {
      closeSearchDropdown();
    }
  });
  document.addEventListener('click', function (e) {
    if (searchDropdown && !searchDropdown.contains(e.target) && e.target !== searchInput) closeSearchDropdown();
  });
  window.addEventListener('hashchange', closeSearchDropdown);

  // "/" jumps to search from anywhere on the page — the hint chip inside the
  // field (.search-kbd) is the promise, this is the payment. Ignored while
  // you're already typing somewhere, so it never eats a literal slash.
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  });

  if (window.__SHARE_ID__) {
    history.replaceState(null, '', '/catalog/#/title/' + window.__SHARE_ID__);
  }
  router();
});
</script>
<script data-deeplink-fallback>
// A mangarecs:// link is a no-op on desktop and on phones without the app
// installed. Race the handoff: if we're still visible 1.2s later, nothing
// caught it, so send them to the download section instead of nowhere.
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[href^="mangarecs://"]') : null;
  if (!a) return;
  e.preventDefault();
  var timer = setTimeout(function () {
    if (!document.hidden) location.href = '/#download';
  }, 1200);
  function cancel() { clearTimeout(timer); }
  window.addEventListener('pagehide', cancel, { once: true });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancel();
  }, { once: true });
  location.href = a.getAttribute('href');
});
