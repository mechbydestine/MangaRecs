  :root {
    --bg: #F6F3FB; --bg-panel: #FFFFFF; --bg-sunken: #EFEAFA;
    --ink: #16121F; --ink-muted: #5B5570; --ink-faint: #8A84A0;
    --accent: #6B46F0; --accent-soft: #8A63FF; --accent-wash: rgba(107,70,240,0.08);
    --line: rgba(107,70,240,0.16); --line-strong: rgba(22,18,31,0.12);
    --warn: #C23B3B; --warn-wash: rgba(194,59,59,0.08);
    --good: #1D9E75;
    --shadow: 0 20px 44px -26px rgba(46,26,110,0.32);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0C11; --bg-panel: #17151F; --bg-sunken: #1D1A26;
      --ink: #F3F1F8; --ink-muted: #A39DB8; --ink-faint: #6D6785;
      --accent: #7B5CFF; --accent-soft: #B18CFF; --accent-wash: rgba(123,92,255,0.10);
      --line: rgba(123,92,255,0.18); --line-strong: rgba(255,255,255,0.10);
      --warn: #FF6B6B; --warn-wash: rgba(255,107,107,0.10);
      --good: #34D399;
      --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F3FB; --bg-panel: #FFFFFF; --bg-sunken: #EFEAFA;
    --ink: #16121F; --ink-muted: #5B5570; --ink-faint: #8A84A0;
    --accent: #6B46F0; --accent-soft: #8A63FF; --accent-wash: rgba(107,70,240,0.08);
    --line: rgba(107,70,240,0.16); --line-strong: rgba(22,18,31,0.12);
    --warn: #C23B3B; --warn-wash: rgba(194,59,59,0.08); --good: #1D9E75;
    --shadow: 0 20px 44px -26px rgba(46,26,110,0.32);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0D0C11; --bg-panel: #17151F; --bg-sunken: #1D1A26;
    --ink: #F3F1F8; --ink-muted: #A39DB8; --ink-faint: #6D6785;
    --accent: #7B5CFF; --accent-soft: #B18CFF; --accent-wash: rgba(123,92,255,0.10);
    --line: rgba(123,92,255,0.18); --line-strong: rgba(255,255,255,0.10);
    --warn: #FF6B6B; --warn-wash: rgba(255,107,107,0.10); --good: #34D399;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Strip Text', -apple-system, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .display { font-family: 'Panel Display', sans-serif; font-weight: 900; letter-spacing: -0.01em; text-transform: uppercase; }

  /* ── Top bar ────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 9px; flex: none; }
  .brand svg { width: 24px; height: 24px; }

<script>
(function () {
  'use strict';

  initThemeToggle('themeToggle');
  initAccountPanel('accountBtn', 'accountPanel');
  wirePosterSaveButtons();

  var SORT_OPTIONS = [
    { id: 'TRENDING_DESC', label: 'Trending' },
    { id: 'POPULARITY_DESC', label: 'Most Popular' },
    { id: 'SCORE_DESC', label: 'Top Rated' },
  ];
  var currentSort = SORT_OPTIONS[0].id;

  var navTabsEl = document.getElementById('navTabs');
  var catRailMobile = document.getElementById('catRailMobile');
  navTabsEl.innerHTML = CATEGORIES.map(function (c) {
    return '<a class="navtab" data-cat="' + c.id + '" href="#/browse/' + c.id + '" onclick="navigate(\'/browse/' + c.id + '\');return false;">' + c.label + '</a>';
  }).join('');

  function debounce(fn, ms) {
    var t;
    return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); };
  }

  function sortSelectHtml() {
    return '<select id="sortSelect" aria-label="Sort by" style="background:var(--bg-panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink);font-size:0.82rem;font-weight:600;font-family:inherit;">' +
      SORT_OPTIONS.map(function (o) { return '<option value="' + o.id + '"' + (o.id === currentSort ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') +
      '</select>';
  }
  function wireSortSelect() {
    var sel = document.getElementById('sortSelect');
    if (sel) sel.addEventListener('change', function () { currentSort = sel.value; router(); });
  }

  // ── Views ─────────────────────────────────────────────────────────────
  var app = document.getElementById('app');

  function renderHome() {
    setActiveTab('all');
    app.innerHTML = skeletonGrid(12);
    trendingMedia(null, 1, currentSort).then(function (d) {
      app.innerHTML =
        '<div class="section-head"><div style="display:flex;align-items:baseline;gap:10px;"><h1 class="section-title">Trending Now</h1><span class="section-sub">' + d.Page.media.length + ' titles</span></div>' + sortSelectHtml() + '</div>' +
        '<div class="grid">' + d.Page.media.map(posterCard).join('') + '</div>';
      wireSortSelect();
    }).catch(function () { app.innerHTML = '<p class="statemsg">Couldn\'t load titles right now. Try again in a moment.</p>'; });
  }

  function renderBrowse(catId) {
    var cat = CATEGORIES.filter(function (c) { return c.id === catId; })[0] || CATEGORIES[0];
    setActiveTab(cat.id);
    app.innerHTML = skeletonGrid(18);
    trendingMedia(cat.id === 'all' ? null : cat, 1, currentSort).then(function (d) {
      app.innerHTML =
        '<div class="section-head"><div style="display:flex;align-items:baseline;gap:10px;"><h1 class="section-title">' + esc(cat.label) + '</h1><span class="section-sub">' + d.Page.media.length + ' titles</span></div>' + sortSelectHtml() + '</div>' +
        '<div class="grid">' + d.Page.media.map(posterCard).join('') + '</div>';
      wireSortSelect();
    }).catch(function () { app.innerHTML = '<p class="statemsg">Couldn\'t load titles right now. Try again in a moment.</p>'; });
  }

  function renderSearch(q) {
    setActiveTab(null);
    app.innerHTML = skeletonGrid(12);
    searchMedia(q, null, 1).then(function (d) {
      if (!d.Page.media.length) { app.innerHTML = '<p class="statemsg">No results for "' + esc(q) + '"</p>'; return; }
      app.innerHTML =
        '<div class="section-head"><h1 class="section-title">"' + esc(q) + '"</h1><span class="section-sub">' + d.Page.media.length + ' results</span></div>' +
        '<div class="grid">' + d.Page.media.map(posterCard).join('') + '</div>';
    }).catch(function () { app.innerHTML = '<p class="statemsg">Search failed. Try again in a moment.</p>'; });
  }

  function renderDetail(id) {
    setActiveTab(null);
    app.innerHTML = '<div class="skeleton" style="height:320px;border-radius:16px;"></div>';
    mediaById(Number(id)).then(function (m) {
      if (!m) { app.innerHTML = '<p class="statemsg">Title not found.</p>'; return; }
      window.scrollTo(0, 0);
      var saved = isSavedLocally(m.id);
      var authors = m.staff.edges.filter(function (e) { return /Story|Art|Creator/i.test(e.role); }).map(function (e) { return e.node.name.full; });
      var genresHtml = m.genres.map(function (g) { return '<span class="genrechip">' + esc(g) + '</span>'; }).join('');
      var spoilerTags = m.tags.filter(function (t) { return t.rank >= 60 && !t.isMediaSpoiler; }).slice(0, 8);
      var warnTags = m.tags.filter(function (t) { return /Gore|Violence|Sexual|Rape|Suicide|Abuse/i.test(t.name); });
      var readLinks = m.externalLinks.filter(function (l) { return l.site && l.url; });
      var descHtml = (m.description || 'No synopsis available.').replace(/<br\s*\/?>/gi, ' ').replace(/\n+/g, ' ');
      var descShort = descHtml.length > 420 ? descHtml.slice(0, 420) + '…' : descHtml;

      app.innerHTML =
        '<a class="backlink" href="#/" onclick="history.back();return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>' +
        '<div class="detail-hero">' +
          '<div class="detail-cover"><img src="' + m.coverImage.extraLarge + '" alt="" /></div>' +
          '<div class="detail-titlewrap">' +
            '<div class="detail-badge-row"><span class="format-badge">' + formatLabel(m) + '</span><span class="status-badge">' + statusLabel(m.status) + '</span></div>' +
            '<h1 class="detail-title">' + esc(titleOf(m)) + '</h1>' +
            (m.title.native ? '<div class="detail-native">' + esc(m.title.native) + '</div>' : '') +
            (m.title.romaji !== titleOf(m) ? '<div class="detail-alt">' + esc(m.title.romaji) + '</div>' : '') +
            '<div class="detail-actions">' +
              '<button class="btn-ghost' + (saved ? ' active' : '') + '" id="saveBtn">' +
                '<svg viewBox="0 0 24 24" fill="' + (saved ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
                (saved ? 'Saved' : 'Save to Library') +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="detail-body">' +
          '<div>' +
            '<div class="card">' +
              '<div class="card-title">Synopsis</div>' +
              '<div class="synopsis" id="synopsisEl">' + descShort + '</div>' +
              (descHtml.length > 420 ? '<button class="showmore" id="showMoreBtn">Show more</button>' : '') +
            '</div>' +
            (m.genres.length ? '<div class="card"><div class="card-title">Genres</div><div class="chiprow">' + genresHtml + '</div></div>' : '') +
            (m.characters.edges.length ? '<div class="card"><div class="card-title">Characters</div><div class="char-grid">' +
              m.characters.edges.map(function (e) {
                return '<div class="char-card"><div class="char-img"><img src="' + e.node.image.medium + '" alt="" loading="lazy" />' +
                  (e.role === 'MAIN' ? '<span class="char-role">Main</span>' : '') + '</div>' +
                  '<div class="char-name">' + esc(e.node.name.full) + '</div></div>';
              }).join('') + '</div></div>' : '') +
          '</div>' +
          '<div>' +
            '<div class="card">' +
              '<div class="card-title">Details</div>' +
              '<dl style="margin:0;">' +
                '<div class="info-row"><dt>Chapters</dt><dd>' + (m.chapters || '—') + '</dd></div>' +
                '<div class="info-row"><dt>Volumes</dt><dd>' + (m.volumes || '—') + '</dd></div>' +
                '<div class="info-row"><dt>Started</dt><dd>' + (m.startDate.year || '—') + '</dd></div>' +
                (m.endDate.year ? '<div class="info-row"><dt>Ended</dt><dd>' + m.endDate.year + '</dd></div>' : '') +
                (authors.length ? '<div class="info-row"><dt>Creator</dt><dd>' + esc(authors.join(', ')) + '</dd></div>' : '') +
                (m.averageScore ? '<div class="info-row"><dt>Score</dt><dd>' + (m.averageScore / 10).toFixed(1) + ' / 10</dd></div>' : '') +
              '</dl>' +
            '</div>' +
            (readLinks.length ? '<div class="card"><div class="card-title">Read Available</div>' +
              readLinks.map(function (l) { return '<a class="btn-ghost" style="width:100%;margin-bottom:8px;justify-content:flex-start;" href="' + l.url + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>' + esc(l.site) + '</a>'; }).join('') +
              '</div>' : '') +
            (warnTags.length ? '<div class="card warncard"><div class="card-title">Content Warnings</div>' +
              warnTags.map(function (t) { return '<div class="warn-item">• ' + esc(t.name) + '</div>'; }).join('') + '</div>' : '') +
          '</div>' +
        '</div>';

      document.getElementById('saveBtn').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        toggleSave(m.id, titleOf(m), m.coverImage.large).then(function (res) {
          btn.disabled = false;
          btn.classList.toggle('active', res.saved);
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (res.saved ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
            (res.saved ? 'Saved' : 'Save to Library');
          if (!res.synced) {
            var warn = document.createElement('div');
            warn.className = 'sync-warning';
            warn.textContent = "Saved locally, but couldn't sync to your account. Check your connection and try again.";
            btn.insertAdjacentElement('afterend', warn);
            setTimeout(function () { warn.remove(); }, 4000);
          }
        });
      });
      if (getCurrentUser() && !saved) {
        isTitleInAccountLibrary(titleOf(m)).then(function (inLibrary) {
          if (!inLibrary) return;
          var btn = document.getElementById('saveBtn');
          if (!btn || btn.classList.contains('active')) return;
          btn.classList.add('active');
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved';
        });
      }
      var moreBtn = document.getElementById('showMoreBtn');
      if (moreBtn) moreBtn.addEventListener('click', function () {
        document.getElementById('synopsisEl').innerHTML = descHtml;
        moreBtn.remove();
      });
    }).catch(function () { app.innerHTML = '<p class="statemsg">Couldn\'t load this title. Try again in a moment.</p>'; });
  }

  // ── My Library (real account data, not the localStorage fallback) ──────
  function skeletonList(n) {
    var out = '';
    for (var i = 0; i < n; i++) out += '<div class="lib-row"><div style="height:14px;width:60%;border-radius:4px;" class="skeleton"></div></div>';
    return out;
  }
  function libStatusLabel(s) { return { reading: 'Reading', completed: 'Completed', bookmarked: 'Bookmarked' }[s] || s; }

  function renderLibrary() {
    setActiveTab(null);
    if (!getCurrentUser()) {
      app.innerHTML =
        '<div class="lib-signedout">' +
          '<h1 class="section-title">My Library</h1>' +
          '<p>Sign in to see the titles you\'ve saved, synced with the app.</p>' +
          '<button class="btn-primary-sm" id="libSignInBtn" type="button" style="width:auto;padding:10px 20px;">Sign in</button>' +
        '</div>';
      document.getElementById('libSignInBtn').addEventListener('click', function () { document.getElementById('accountBtn').click(); });
      return;
    }
    app.innerHTML = '<h1 class="section-title" style="margin-bottom:16px;">My Library</h1><div class="lib-list" id="libList">' + skeletonList(6) + '</div>';
    sb.from('reading_progress').select('series_title,status,current_chapter,total_chapters,updated_at')
      .eq('user_id', getCurrentUser().id).order('updated_at', { ascending: false })
      .then(function (res) {
        var listEl = document.getElementById('libList');
        if (res.error) { listEl.innerHTML = '<p class="statemsg">Couldn\'t load your library. Try again in a moment.</p>'; return; }
        var rows = res.data || [];
        if (!rows.length) { listEl.innerHTML = '<p class="statemsg">Nothing saved yet — browse the catalog and hit save on a title.</p>'; return; }
        listEl.innerHTML = rows.map(function (r) {
          return '<div class="lib-row">' +
            '<div class="lib-row-main">' +
              '<div class="lib-row-title">' + esc(r.series_title) + '</div>' +
              (r.status === 'reading' && r.current_chapter ? '<div class="lib-row-sub">Chapter ' + r.current_chapter + (r.total_chapters ? ' of ' + r.total_chapters : '') + '</div>' : '') +
            '</div>' +
            '<span class="lib-pill lib-' + r.status + '">' + libStatusLabel(r.status) + '</span>' +
          '</div>';
        }).join('');
      }).catch(function () { document.getElementById('libList').innerHTML = '<p class="statemsg">Couldn\'t load your library. Try again in a moment.</p>'; });
  }

  function setActiveTab(id) {
    Array.prototype.forEach.call(navTabsEl.children, function (el) {
      el.classList.toggle('active', el.getAttribute('data-cat') === id);
    });
  }

  // ── Router ────────────────────────────────────────────────────────────
  function router() {
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'title' && parts[1]) return renderDetail(parts[1]);
    if (parts[0] === 'browse' && parts[1]) return renderBrowse(parts[1]);
    if (parts[0] === 'search' && parts[1]) return renderSearch(decodeURIComponent(parts[1]));
    if (parts[0] === 'library') return renderLibrary();
    return renderHome();
  }
  window.navigate = function (path) { location.hash = path; };
  window.addEventListener('hashchange', router);

  var searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', debounce(function () {
    var q = searchInput.value.trim();
    if (q.length >= 2) navigate('/search/' + encodeURIComponent(q));
    else if (q.length === 0 && location.hash.indexOf('#/search') === 0) navigate('/');
  }, 450));

  router();
})();
</script>
